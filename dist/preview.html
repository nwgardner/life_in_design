<title>Life in Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Nunito+Sans:ital,wght@0,300..800;1,300..600&family=Caveat:wght@400..600&display=swap">
<style>
/* Layout: a cairn on a riverbank. Stones are stacked from the ground up (Why, How, What); the page is linen under drifting fog,
   with wide margins to breathe, and nothing snaps: it settles. */
:root{
  /* Mist & Stone · the ground */
  --paper:#F5F2EB; --sheet:rgba(250,248,245,.80); --sheet-solid:#FAF8F5; --ink:#2C302E; --muted:#65675F; --rule:#D4CDC3; --line:rgba(196,187,174,.62);
  /* Forest Floor · the hand */
  --accent:#525B44; --accent-ink:#F5F2EB; --sand:#C5A880; --driftwood:#9C8470; --oat:#EAE3D2;
  /* the cairn: stone (Why), wood (How), leaf (What) */
  --why:#708090; --why-ink:#52616F; --why-soft:#E3EBF0;
  --how:#9C8470; --how-ink:#6E5B4A; --how-soft:#EAE3D2;
  --what:#8A9A86; --what-ink:#56664F; --what-soft:#E1E6DA;
  --me:#E5E9DE; --danger:#9B4A36; --glow:rgba(138,154,134,.38);
  /* Horizon · the sky (shifts with the hour) */
  --s1:#E3EBF0; --s2:#D6C7BD; --s3:#EAE3D2; --s4:#DCE2D5; --sky-o:.78;
  --shadow:5px 12px 32px -18px rgba(82,70,52,.30), 1px 2px 5px rgba(82,70,52,.05);
  --shadow-lift:9px 22px 44px -20px rgba(82,70,52,.38), 2px 4px 8px rgba(82,70,52,.06);
  --grain-o:.42; --grain-blend:multiply;
  --display:'Fraunces', 'Iowan Old Style', Georgia, serif;
  --body:'Nunito Sans', 'Avenir Next', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand:'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
  --mono:var(--body);
  --r:28px; --r-sm:18px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.3,1);
}
:root[data-tod="dawn"]{ --s1:#F0E1D5; --s2:#E3EBF0; --s3:#EBDCCB; --s4:#E4E8DD }
:root[data-tod="dusk"]{ --s1:#D6C7BD; --s2:#CDD3DA; --s3:#E6D4C1; --s4:#D8DCD0 }
:root[data-tod="night"]{ --s1:#D2DAE2; --s2:#CCC5BE; --s3:#DDD6CA; --s4:#CDD5CB }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1B1E1C; --sheet:rgba(37,41,38,.82); --sheet-solid:#252926; --ink:#ECE7DD; --muted:#A9A69C; --rule:#3E433E; --line:rgba(96,102,94,.5);
  --accent:#AAB78F; --accent-ink:#1B1E1C; --sand:#C5A880; --driftwood:#B59C86; --oat:#2E2B25;
  --why:#93A3B3; --why-ink:#B0BECB; --why-soft:#26313A; --how:#B59C86; --how-ink:#CFB8A2; --how-soft:#342E27; --what:#A3B39E; --what-ink:#BECCB8; --what-soft:#29322A;
  --me:#2C382D; --danger:#E3967F; --glow:rgba(170,183,143,.30);
  --s1:#22303A; --s2:#3A3029; --s3:#26302A; --s4:#2F2C31; --sky-o:.9;
  --shadow:5px 12px 32px -18px rgba(0,0,0,.65), 1px 2px 5px rgba(0,0,0,.25); --shadow-lift:9px 22px 44px -20px rgba(0,0,0,.75), 2px 4px 8px rgba(0,0,0,.3);
  --grain-o:.32; --grain-blend:overlay; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1B1E1C; --sheet:rgba(37,41,38,.82); --sheet-solid:#252926; --ink:#ECE7DD; --muted:#A9A69C; --rule:#3E433E; --line:rgba(96,102,94,.5);
  --accent:#AAB78F; --accent-ink:#1B1E1C; --sand:#C5A880; --driftwood:#B59C86; --oat:#2E2B25;
  --why:#93A3B3; --why-ink:#B0BECB; --why-soft:#26313A; --how:#B59C86; --how-ink:#CFB8A2; --how-soft:#342E27; --what:#A3B39E; --what-ink:#BECCB8; --what-soft:#29322A;
  --me:#2C382D; --danger:#E3967F; --glow:rgba(170,183,143,.30);
  --s1:#22303A; --s2:#3A3029; --s3:#26302A; --s4:#2F2C31; --sky-o:.9;
  --shadow:5px 12px 32px -18px rgba(0,0,0,.65), 1px 2px 5px rgba(0,0,0,.25); --shadow-lift:9px 22px 44px -20px rgba(0,0,0,.75), 2px 4px 8px rgba(0,0,0,.3);
  --grain-o:.32; --grain-blend:overlay; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:360;line-height:1.08;text-wrap:balance;margin:0;font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.012em}
h1{font-size:clamp(2.5rem,5.6vw,4.3rem);font-weight:320}
h2{font-size:clamp(1.65rem,3.2vw,2.35rem)}
h3{font-size:1.3rem;font-weight:420}
h1 em,h2 em{font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1}
p{margin:0}
.mono{font-family:var(--body);font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--muted)}
.hand{font-family:var(--hand);font-weight:500;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* atmosphere: fog that drifts, paper that breathes */
.sky{position:fixed;inset:-12vmax;z-index:-2;pointer-events:none;overflow:hidden;opacity:var(--sky-o);transform:rotate(var(--phase,0deg));transition:transform 9s var(--ease)}
.sky i{position:absolute;display:block;width:56vmax;height:48vmax;filter:blur(64px);border-radius:46% 54% 60% 40%/50% 42% 58% 50%;
  animation:drift 80s ease-in-out infinite alternate, morph 26s ease-in-out infinite alternate;will-change:transform}
.sky .b1{background:var(--s1);top:0;left:4vmax}
.sky .b2{background:var(--s2);top:16vmax;right:0;animation-duration:96s,31s;animation-delay:-30s,-9s}
.sky .b3{background:var(--s3);bottom:0;left:36vmax;animation-duration:88s,29s;animation-delay:-50s,-14s}
.sky .b4{background:var(--s4);top:42vmax;left:0;width:42vmax;height:38vmax;animation-duration:110s,37s;animation-delay:-70s,-4s}
.sky.exhale{animation:exhale 6s var(--ease)}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(7vmax,5vmax) scale(1.09)}100%{transform:translate(-5vmax,8vmax) scale(.94)}}
@keyframes morph{0%{border-radius:46% 54% 60% 40%/50% 42% 58% 50%}100%{border-radius:60% 40% 36% 64%/42% 60% 40% 58%}}
@keyframes exhale{0%{filter:none}35%{filter:saturate(1.35) brightness(1.05)}100%{filter:none}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--grain-o);mix-blend-mode:var(--grain-blend);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .32 0 0 0 0 .27 0 0 0 0 .21 0 0 0 .5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.ripple{position:fixed;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid var(--what);border-radius:47% 53% 50% 50%/52% 48% 52% 48%;pointer-events:none;z-index:45;opacity:.55;animation:ripple 2.8s var(--ease) forwards}
.ripple.r2{animation-delay:.35s;border-color:var(--sand);opacity:0}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(46);opacity:0}}

/* shell */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 10px 8px 18px;border-radius:999px;
  background:var(--sheet);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);border:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:400;font-size:1.32rem;letter-spacing:-.01em;font-variation-settings:"SOFT" 100}
.brand svg{width:30px;height:30px;flex:none;transition:transform .9s var(--spring)}
.brand:hover svg{transform:rotate(-6deg) translateY(-1px)}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.93rem;transition:background .5s var(--ease),color .4s,transform .5s var(--spring)}
.nav button:hover{color:var(--ink);transform:translateY(-1px)}
.nav button[aria-current="page"]{background:var(--what-soft);color:var(--ink)}
.preview-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--how-ink);background:var(--how-soft);border-radius:999px;padding:3px 10px}
main{max-width:1180px;margin:0 auto;padding-block:52px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.enter>*{animation:rise .9s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.08s}main.enter>*:nth-child(3){animation-delay:.16s}main.enter>*:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:.25;transform:translateY(14px)}to{opacity:1;transform:none}}
footer{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;color:var(--muted);font-size:.86rem;position:relative;
  padding-block:34px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wave{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:0;height:14px;background:var(--rule);opacity:.9;
  -webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='14'%3E%3Cpath d='M0 7 C 22 2, 38 12, 60 7 S 98 3, 120 8 S 158 11, 180 7' fill='none' stroke='black' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E") repeat-x center/180px 14px;
  mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='14'%3E%3Cpath d='M0 7 C 22 2, 38 12, 60 7 S 98 3, 120 8 S 158 11, 180 7' fill='none' stroke='black' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E") repeat-x center/180px 14px}

/* controls: everything gives a little, then settles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet-solid);color:var(--ink);
  padding:11px 20px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;
  transition:transform .6s var(--spring),box-shadow .6s var(--ease),background .4s,border-color .4s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow);border-color:var(--rule)}
.btn:active{transform:scale(.97);transition-duration:.12s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -12px var(--accent)}
.btn.primary:hover{box-shadow:0 14px 28px -14px var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:12px;box-shadow:none}
.btn.ghost:hover{color:var(--ink);background:var(--sheet);box-shadow:none}
.btn.small{padding:7px 14px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
label{display:block;font-weight:700;font-size:.93rem;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:.87rem}
input[type=text],input[type=email],textarea{width:100%;border:1px solid var(--line);background:var(--sheet-solid);border-radius:var(--r-sm);padding:12px 16px;line-height:1.5;
  transition:box-shadow .5s var(--ease),border-color .4s}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--what);box-shadow:0 0 0 5px var(--glow)}
.field{display:grid;gap:2px}
.choice{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0;cursor:pointer}
.choice input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:3px 11px;white-space:nowrap;
  background:color-mix(in srgb,currentColor 13%,transparent)}
.chip.approved{color:var(--what-ink)}
.chip.draft{color:var(--how-ink)}
.chip.gap{color:var(--muted);background:transparent;border:1px dashed var(--rule)}
.chip.locked{color:var(--muted);opacity:.75}
.chip.next{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--danger);font-size:.92rem}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-family:var(--body);font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.16rem;color:var(--muted);max-width:56ch;line-height:1.6}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:12px 22px;border-radius:999px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow-lift);animation:float-in .7s var(--spring)}
@keyframes float-in{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

/* welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start}
.welcome .intro{display:grid;gap:22px;padding-top:12px;padding-left:clamp(0px,3vw,40px)}
.welcome .intro p{max-width:54ch}
.welcome form{padding:30px;display:grid;gap:20px;border-radius:36px 28px 34px 30px/30px 34px 28px 36px}
.pyr-art{width:100%;max-width:440px;height:auto;overflow:visible}
.pyr-art .float{animation:settle 7s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes settle{from{transform:translateY(0) rotate(0)}to{transform:translateY(-3px) rotate(-1.2deg)}}
.tiny-legend{display:grid;gap:8px;font-size:.95rem}
.tiny-legend span{display:inline-block;width:14px;height:11px;border-radius:55% 45% 50% 50%/60% 55% 45% 40%;margin-right:10px;vertical-align:middle}

/* journey: the cairn */
.hero{display:grid;gap:12px;margin-bottom:44px;padding-left:clamp(0px,4vw,56px)}
.hero h1{max-width:18ch}
.journey{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:32px;align-items:start}
.plan{padding:28px 24px 22px;display:grid;gap:12px;justify-items:center;position:relative;border-radius:40px 32px 44px 34px/34px 40px 32px 42px}
.plan-head{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tier.what{width:68%}.tier.how{width:86%}.tier.why{width:100%}
.tier-label{width:100%;display:flex;align-items:center;gap:12px;font-family:var(--hand);font-size:1.22rem;color:var(--muted);line-height:1}
.tier-label::after{content:"";flex:1;height:8px;background:var(--rule);opacity:.8;
  -webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8'%3E%3Cpath d='M0 4 C 18 1, 32 7, 50 4 S 86 2, 120 5' fill='none' stroke='black' stroke-width='1.2'/%3E%3C/svg%3E") repeat-x center/120px 8px;
  mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8'%3E%3Cpath d='M0 4 C 18 1, 32 7, 50 4 S 86 2, 120 5' fill='none' stroke='black' stroke-width='1.2'/%3E%3C/svg%3E") repeat-x center/120px 8px}
.tier.what+.tier-label,.tier.how+.tier-label{margin-top:6px}
.cell{position:relative;text-align:left;border:1px solid var(--line);padding:12px 14px 12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:6px;
  background:var(--sheet-solid);border-radius:28px 22px 30px 20px/24px 30px 20px 28px;box-shadow:var(--shadow);
  transition:transform .7s var(--spring),box-shadow .6s var(--ease),border-color .4s}
.tier .cell:nth-child(2){border-radius:22px 30px 24px 30px/30px 22px 28px 22px}
.tier .cell:nth-child(3){border-radius:30px 24px 22px 32px/22px 28px 30px 24px}
.cell:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--shadow-lift)}
.cell .n{font-family:var(--hand);font-size:1rem;color:var(--muted);line-height:1}
.cell .t{font-weight:700;line-height:1.25;font-size:.98rem;overflow-wrap:anywhere}
.cell .s{margin-top:auto}
.cell.done.L-Why{background:var(--why-soft);border-color:color-mix(in srgb,var(--why) 35%,transparent)}
.cell.done.L-How{background:var(--how-soft);border-color:color-mix(in srgb,var(--how) 35%,transparent)}
.cell.done.L-What{background:var(--what-soft);border-color:color-mix(in srgb,var(--what) 40%,transparent)}
.cell.locked{opacity:.5;border-style:dashed;cursor:default;box-shadow:none;background:transparent}
.cell.locked:hover{transform:none;box-shadow:none}
.cell.is-next,.slab.is-next{animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:var(--shadow),0 0 0 0 var(--glow)}50%{box-shadow:var(--shadow),0 0 0 9px var(--glow)}}
.slab{width:100%;border:1px solid color-mix(in srgb,var(--why) 30%,transparent);padding:16px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;cursor:pointer;text-align:left;
  background:radial-gradient(120% 140% at 15% 0%,color-mix(in srgb,var(--sheet-solid) 55%,transparent),transparent 60%),var(--why-soft);
  border-radius:46px 38px 50px 34px/30px 36px 26px 32px;box-shadow:var(--shadow);transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.slab:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.slab .t{font-weight:700;font-family:var(--display);font-size:1.15rem;font-weight:450}
.ground{width:100%;text-align:center;font-family:var(--hand);font-size:1.1rem;color:var(--muted);padding-top:2px}
.side{display:grid;gap:18px}
.card{padding:24px;display:grid;gap:12px}
.card h3{font-size:1.2rem}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}

/* explore */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.area{padding:18px;display:grid;gap:10px;text-align:left;cursor:pointer;border-radius:26px 20px 28px 22px/22px 28px 20px 26px;border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow);
  transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.area:nth-child(3n+2){border-radius:20px 28px 22px 26px/28px 20px 26px 22px}
.area:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.area .t{font-weight:700;font-size:1.04rem}
.ticks{display:flex;gap:5px}
.ticks i{width:16px;height:7px;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;background:var(--rule)}
.ticks i.on{background:var(--why)}
.ticks i.skip{background:transparent;border:1px dashed var(--rule)}
.ticks i.cur{background:var(--accent)}
.area .belief{font-family:var(--display);font-size:.98rem;color:var(--muted);font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1}
.add-area{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.add-area .field{flex:1;min-width:200px}

/* studio: a quiet room for one conversation */
.studio{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.brief{padding:24px;display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);max-height:calc(100vh - 120px);overflow:auto;border-radius:32px 26px 30px 28px}
.brief .q{font-family:var(--display);font-size:1.2rem;line-height:1.35;font-weight:380;font-variation-settings:"SOFT" 100}
.brief .block{display:grid;gap:6px}
.statement{white-space:pre-wrap;background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:18px 14px 18px 12px;padding:12px 16px;border-left:3px solid var(--what);font-size:.96rem}
.lenses{display:grid;gap:2px;margin:0;padding:0;list-style:none;counter-reset:l}
.lenses li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:.93rem;color:var(--muted)}
.lenses li .dot{width:15px;height:13px;border-radius:58% 42% 52% 48%/55% 50% 50% 45%;border:1.5px solid var(--rule);justify-self:center;transition:transform .8s var(--spring)}
.lenses li.done .dot{background:var(--why);border-color:var(--why)}
.lenses li.skip .dot{border-style:dashed}
.lenses li.cur{color:var(--ink);font-weight:700}
.lenses li.cur .dot{border-color:var(--accent);background:var(--glow);transform:scale(1.25)}
.layer-tag{font-family:var(--body);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.layer-tag.Why{color:var(--why-ink)}.layer-tag.How{color:var(--how-ink)}.layer-tag.What{color:var(--what-ink)}
.chat{display:grid;grid-template-rows:auto 1fr auto;min-height:calc(100vh - 190px);border-radius:34px 30px 32px 28px;overflow:hidden}
.chat-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line)}
.stream{padding:26px 24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;max-height:calc(100vh - 350px);min-height:280px;scroll-behavior:smooth}
.msg{max-width:68ch;padding:14px 20px;line-height:1.7;overflow-wrap:anywhere;animation:rise .8s var(--ease) both}
.msg p+p{margin-top:.75em}
.msg ul{margin:.5em 0 0;padding-left:1.2em}
.msg.coach{align-self:flex-start;background:var(--sheet-solid);border:1px solid var(--line);border-radius:6px 26px 24px 22px/6px 24px 26px 22px;font-size:1.02rem}
.msg.me{align-self:flex-end;background:var(--me);border-radius:26px 6px 22px 24px/24px 6px 26px 22px;white-space:pre-wrap}
.divider{align-self:center;text-align:center;font-family:var(--hand);font-size:1.08rem;color:var(--muted);max-width:60ch;padding:0 12px;line-height:1.3}
.typing{display:inline-flex;gap:6px;padding:6px 2px;align-items:center}
.typing i{width:9px;height:8px;border-radius:58% 42% 52% 48%/55% 50% 50% 45%;background:var(--what);animation:bob 2.4s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.3s;background:var(--sand)}.typing i:nth-child(3){animation-delay:.6s;background:var(--why)}
@keyframes bob{0%,100%{transform:translateY(0) scale(.9);opacity:.5}50%{transform:translateY(-4px) scale(1.1);opacity:1}}
.compose{border-top:1px solid var(--line);padding:14px 18px;display:grid;gap:12px}
.compose .actions{display:flex;gap:8px;flex-wrap:wrap}
.compose .send{display:flex;gap:10px;align-items:flex-end}
.compose textarea{min-height:56px;max-height:220px;flex:1;border-radius:22px}
.coach-err{align-self:stretch;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--danger);font-size:.92rem}

/* design */
.layer{display:grid;gap:14px;margin-top:36px}
.layer-head{display:flex;align-items:baseline;gap:14px;padding-bottom:8px;position:relative}
.layer-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--rule);
  -webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8'%3E%3Cpath d='M0 4 C 18 1, 32 7, 50 4 S 86 2, 120 5' fill='none' stroke='black' stroke-width='1.6'/%3E%3C/svg%3E") repeat-x center/120px 8px;
  mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8'%3E%3Cpath d='M0 4 C 18 1, 32 7, 50 4 S 86 2, 120 5' fill='none' stroke='black' stroke-width='1.6'/%3E%3C/svg%3E") repeat-x center/120px 8px}
.layer-head.Why::after{background:var(--why)}.layer-head.How::after{background:var(--how)}.layer-head.What::after{background:var(--what)}
.el{padding:20px 24px;display:grid;gap:12px}
.el-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.el-top h3{margin-right:auto}
.el .gap{color:var(--muted);font-style:italic}
details summary{cursor:pointer;color:var(--muted);font-size:.92rem}
.hist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.hist li{border-left:2px solid var(--rule);padding-left:14px;font-size:.93rem}
.hist .when{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.map details{padding:18px 22px}
.map summary{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--ink)}
.map dl{display:grid;gap:12px;margin:14px 0 0}
.map dt{font-weight:700;font-size:.92rem}
.map dd{margin:0;white-space:pre-wrap;color:var(--muted);font-size:.95rem}

/* dialog: a held breath */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:30;display:grid;place-items:center;animation:fade .5s var(--ease);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:30px;display:grid;gap:18px;background:var(--sheet-solid);border-radius:36px 30px 34px 32px/32px 36px 30px 34px;animation:bloom .7s var(--spring)}
@keyframes bloom{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

/* inputs */
.tabs{display:flex;gap:6px;margin-bottom:26px;overflow-x:auto;padding:4px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
.tabs button{background:none;border:0;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .5s var(--ease),color .3s}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--what-soft)}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:14px}
.test{padding:20px;display:grid;gap:10px;align-content:start;text-align:left;border-radius:26px 20px 28px 22px/22px 28px 20px 26px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;box-shadow:var(--shadow);
  transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.test:nth-child(even){border-radius:20px 28px 22px 26px/28px 20px 26px 22px}
.test:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.test.has{background:linear-gradient(160deg,var(--what-soft),var(--sheet) 70%)}
.test .t{font-weight:800;font-size:1.04rem}
.test .sum{font-size:.94rem;line-height:1.5}
.test .feeds{display:flex;gap:6px;flex-wrap:wrap}
.dialog.wide{width:min(800px,100%)}
.ed-sec{display:grid;gap:12px;padding-top:4px}
.ed-sec+.ed-sec{border-top:1px solid var(--line);padding-top:16px}
.picked{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:pk}
.picked li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--what-soft);border-radius:16px 20px 18px 14px;padding:6px 8px;animation:rise .6s var(--spring)}
.picked li::before{counter-increment:pk;content:counter(pk);font-family:var(--hand);font-size:1.15rem;color:var(--what-ink);text-align:center}
.picked .g{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.picked .ctl{display:flex;gap:2px}
.icon{border:0;background:transparent;width:32px;height:32px;border-radius:50% 46% 52% 48%;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;transition:transform .5s var(--spring),background .3s}
.icon:hover{background:var(--sheet-solid);color:var(--ink);transform:scale(1.1)}
.icon[disabled]{opacity:.3;cursor:default;transform:none}
.optgroup{display:grid;gap:8px}
.optgroup .gl{font-family:var(--hand);font-size:1.12rem;color:var(--muted);line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:var(--sheet-solid);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem;transition:transform .55s var(--spring),background .35s,color .35s}
.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.04)}
.opt[disabled]{opacity:.4;cursor:default;transform:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap;background:var(--sheet-solid);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-size:.9rem;border-radius:999px;transition:background .45s var(--ease),color .3s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pairrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.pairrow .seg{width:100%}
.pairrow .seg button{flex:1}
.pct{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
.pct input{width:76px}
.scorerow{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 70px;gap:14px;align-items:center}
.scorerow input[type=range]{width:100%;accent-color:var(--accent)}
.scorerow input[type=number]{width:70px;padding:7px 10px}
.bkrow{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:10px;align-items:center}
.bkrow .seg{width:100%}.bkrow .seg button{flex:1}
.chip.L-Why{color:var(--why-ink)}.chip.L-How{color:var(--how-ink)}.chip.L-What{color:var(--what-ink)}
.bkcount{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;font-weight:700;color:var(--muted)}
.bkcount .ok{color:var(--what-ink)}
input[type=number],input[type=date],select{border:1px solid var(--line);background:var(--sheet-solid);border-radius:14px;padding:9px 12px}
.entries{display:grid;gap:14px;margin-top:22px}
.entry{padding:20px 24px;display:grid;gap:10px}
.entries .entry:nth-child(even){border-radius:24px 32px 26px 30px}
.entry .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--muted)}
.entry .body{white-space:pre-wrap;font-family:var(--display);font-size:1.08rem;line-height:1.6;font-weight:360;font-variation-settings:"SOFT" 100}
.entry .prompt{font-family:var(--hand);color:var(--muted);font-size:1.15rem;line-height:1.3}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.growthcol{display:grid;gap:14px;align-content:start}
/* iterate */
.meter{display:grid;gap:10px}
.meter .bar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--rule) 60%,transparent);overflow:hidden;display:flex}
.meter .bar i{display:block;height:100%;transition:width 1.6s var(--ease)}
.meter .bar .tr{background:var(--what);border-radius:999px}.meter .bar .wk{background:var(--sand)}
.score{font-family:var(--display);font-size:2.8rem;line-height:1;font-weight:320;font-variation-settings:"SOFT" 100}
.trace{width:100%;border-collapse:collapse;font-size:.93rem;min-width:520px}
.trace th{text-align:left;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.trace td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.chip.traced{color:var(--what-ink)}.chip.weak{color:var(--how-ink)}.chip.untraced{color:var(--danger)}
.scroll-x{overflow-x:auto}
.gcards{display:grid;gap:16px}
.gcard{padding:22px 26px;display:grid;gap:12px;position:relative;overflow:hidden}
.gcard::before{content:"";position:absolute;width:140px;height:120px;left:-50px;top:-50px;border-radius:46% 54% 60% 40%/50% 42% 58% 50%;opacity:.55;filter:blur(2px);pointer-events:none}
.gcard.Why::before{background:var(--why-soft)}.gcard.How::before{background:var(--how-soft)}.gcard.What::before{background:var(--what-soft)}
.gcard>*{position:relative}
.gcard h3{font-family:var(--display);font-weight:420;font-size:1.3rem;line-height:1.3}
.gcard .act{font-size:.93rem;background:color-mix(in srgb,var(--paper) 75%,transparent);border-radius:16px 20px 18px 14px;padding:10px 14px}
.depth{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:10px}
.depth .d{font-family:var(--hand);font-size:1.12rem;color:var(--muted)}
.nudges{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.nudges li{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.nudges li:first-child{border-top:0;padding-top:0}
.toggle{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .tx{display:grid;gap:2px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:3px}
.loading{display:flex;gap:14px;align-items:center;padding:22px 26px;margin-bottom:22px}
/* design: the landing page, a conversation at the center */
.hero.compact{margin-bottom:26px;gap:8px}
.hero.compact h1{max-width:none;font-size:clamp(2.1rem,4.2vw,3rem)}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:26px;align-items:start}
.home .chat{min-height:0;border-radius:38px 32px 36px 30px/32px 38px 30px 36px;box-shadow:var(--shadow-lift)}
.home .stream{height:clamp(280px,calc(100vh - 490px),620px);max-height:none;min-height:0;padding:30px 30px 24px}
.home .chat.begin .stream{height:clamp(240px,calc(100vh - 560px),560px)}
.home .msg.coach{font-size:1.06rem}
.home .chat-head{padding:16px 26px}
.chat-head .where{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rail{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.rail .card{padding:20px 22px}
.rail .brief{position:static;max-height:none;padding:20px 22px}
.protip{display:grid;gap:6px;text-align:left;cursor:pointer;padding:16px 20px 16px 22px;border:1px dashed color-mix(in srgb,var(--how) 55%,transparent);
  background:color-mix(in srgb,var(--how-soft) 70%,transparent);border-radius:22px 28px 20px 26px/26px 20px 28px 22px;color:var(--ink);
  transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.protip:hover{transform:translateY(-2px) rotate(-.3deg);box-shadow:var(--shadow)}
.protip .k{font-family:var(--hand);font-size:1.25rem;color:var(--how-ink);line-height:1}
.protip .tx{font-size:.93rem;line-height:1.5}
.protip .go{font-weight:700;font-size:.88rem;color:var(--how-ink)}
.path{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.path .lyr{display:grid;gap:4px}
.path .lyr>span{font-family:var(--hand);font-size:1.08rem;color:var(--muted);line-height:1}
.path button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;color:var(--muted);font-size:.92rem}
.path button:hover{color:var(--ink)}
.path button[disabled]{cursor:default;opacity:.55}
.path button[disabled]:hover{color:var(--muted)}
.path i{width:14px;height:12px;flex:none;border-radius:58% 42% 52% 48%/55% 50% 50% 45%;border:1.5px solid var(--rule)}
.path .done i{border-color:transparent}
.path .done.L-Why i{background:var(--why)}.path .done.L-How i{background:var(--how)}.path .done.L-What i{background:var(--what)}
.path .now{color:var(--ink);font-weight:700}
.path .now i{border-color:var(--accent);background:var(--glow);transform:scale(1.2)}
.stones{display:grid;gap:10px}
.stones .opts{gap:8px}
.stone{border:1px solid var(--line);background:var(--sheet-solid);padding:8px 15px;cursor:pointer;font-size:.92rem;font-weight:600;color:var(--ink);
  border-radius:20px 16px 22px 14px/16px 22px 14px 20px;transition:transform .6s var(--spring),box-shadow .5s var(--ease),background .4s}
.stone:nth-child(3n+2){border-radius:16px 22px 14px 20px/22px 14px 20px 16px}
.stone:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stone.gentle{background:var(--what-soft);border-color:color-mix(in srgb,var(--what) 45%,transparent)}
.stone.tender{border-style:dashed}
.stone.chosen{color:var(--muted)}
.stone.chosen::before{content:"✓ ";color:var(--what-ink)}
.stones .own{display:flex;gap:8px;flex-wrap:wrap}
.stones .own input{flex:1;min-width:160px;padding:9px 14px;border-radius:999px}
/* what's new: a quiet mark on what changed, until it's been visited */
.nav button{position:relative}
.newpip{position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-family:var(--hand);font-size:.92rem;line-height:1;font-weight:400;
  padding:2px 7px 3px;border-radius:999px;background:var(--accent);color:var(--paper);pointer-events:none;letter-spacing:.02em;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);animation:pip-glow 3.6s var(--ease) infinite}
@keyframes pip-glow{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 6%,transparent)}}
.tabs button{position:relative}
.tabs .newpip{top:-9px}
.newmark{display:inline-flex;align-items:center;gap:6px;font-family:var(--hand);font-size:1.05rem;line-height:1.1;color:var(--accent)}
.newmark::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.spot-glow{animation:spot-glow 2.4s var(--ease) 2}
@keyframes spot-glow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow-lift)}}
.dialog.whatsnew{width:min(640px,100%);gap:18px}
.wn-items{display:grid;gap:12px}
.wn-item{display:grid;gap:6px;padding:16px 18px 16px 20px;border:1px solid var(--line);background:var(--sheet-solid);border-radius:22px 18px 24px 20px/18px 24px 20px 22px}
.wn-item:nth-child(even){border-radius:18px 24px 20px 22px/24px 18px 22px 20px}
.wn-item .where{font-family:var(--hand);font-size:1.05rem;line-height:1;color:var(--muted)}
.wn-item b{font-family:var(--display);font-weight:450;font-size:1.2rem}
.wn-item p{margin:0;font-size:.94rem;line-height:1.55;color:var(--muted)}
.wn-item .row{margin-top:4px}
.notice{position:fixed;top:calc(env(safe-area-inset-top,0px) + 88px);left:max(16px,env(safe-area-inset-left,0px));z-index:30;width:min(360px,calc(100% - 32px));
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:14px 14px 14px 18px;
  background:var(--sheet-solid);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:20px 24px 22px 18px;
  box-shadow:var(--shadow-lift);animation:notice-in .9s var(--spring)}
.notice.out{animation:notice-out .6s var(--ease) forwards}
@keyframes notice-in{from{opacity:0;transform:translate(-18px,-10px)}to{opacity:1;transform:none}}
@keyframes notice-out{to{opacity:0;transform:translate(-14px,-6px)}}
.notice .k{font-family:var(--hand);font-size:1.12rem;line-height:1;color:var(--accent)}
.notice p{margin:2px 0 0;font-size:.92rem;line-height:1.45;grid-column:1/-1}
.notice .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.notice .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:2px 4px}
@media (max-width:560px){
  .newpip{top:1px;left:auto;right:1px;transform:none;width:7px;height:7px;padding:0;font-size:0;color:transparent}
  .tabs .newpip{top:3px;right:3px}
  .notice{top:calc(env(safe-area-inset-top,0px) + 112px)}
}
@media (prefers-reduced-motion:reduce){ .newpip,.notice,.spot-glow{animation:none} }
/* goals: four horizons, each with its own shape */
.horizons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:26px}
.hz{display:grid;gap:6px;align-content:start;text-align:left;padding:18px 18px 16px;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--sheet);
  border-radius:26px 20px 28px 22px/22px 28px 20px 26px;box-shadow:var(--shadow);transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.hz:nth-child(even){border-radius:20px 28px 22px 26px/28px 20px 26px 22px}
.hz:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.hz .span{font-family:var(--hand);font-size:1.15rem;line-height:1;color:var(--muted)}
.hz b{font-family:var(--display);font-weight:450;font-size:1.25rem}
.hz .shape{font-size:.84rem;color:var(--muted)}
.hz .add{font-weight:700;font-size:.88rem;color:var(--accent)}
.hz.short{background:linear-gradient(160deg,var(--what-soft),var(--sheet) 75%)}
.hz.mid{background:linear-gradient(160deg,var(--how-soft),var(--sheet) 75%)}
.hz.long{background:linear-gradient(160deg,var(--why-soft),var(--sheet) 75%)}
.hz.life{background:linear-gradient(160deg,color-mix(in srgb,var(--why-soft) 60%,var(--how-soft)),var(--sheet) 80%)}
.gband{display:grid;gap:12px;margin-bottom:24px}
.gband>h3{font-family:var(--display);font-weight:450;font-size:1.25rem;margin:0;display:flex;gap:10px;align-items:baseline}
.gband>h3 span{font-family:var(--hand);font-size:1.05rem;color:var(--muted)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.goal{display:grid;gap:8px;align-content:start;text-align:left;padding:18px 20px;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--sheet-solid);
  border-radius:24px 20px 26px 18px/20px 26px 18px 24px;transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.goal:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.goal .t{font-weight:800;font-size:1.02rem;line-height:1.35}
.goal .sum{font-size:.92rem;line-height:1.5;color:var(--muted)}
.goal .marks{display:flex;gap:6px;flex-wrap:wrap}
.goal.done{background:linear-gradient(160deg,var(--what-soft),var(--sheet-solid) 70%)}
.goal blockquote,.ticket blockquote{margin:0;padding-left:12px;border-left:2px solid var(--what);font-family:var(--display);font-size:.98rem;line-height:1.45}
.krs{display:grid;gap:6px}
.kr{display:grid;gap:3px;font-size:.86rem}
.kr .track{height:7px;border-radius:999px;background:color-mix(in srgb,var(--rule) 60%,transparent);overflow:hidden}
.kr .track i{display:block;height:100%;background:var(--how);border-radius:999px}
.dialog.goal-ed{width:min(780px,100%)}
.letter{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.letter>span{font-family:var(--display);font-size:2rem;line-height:1;color:var(--what-ink);text-align:center;padding-top:4px}
.krrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;align-items:center}
.krrow input[type=range]{accent-color:var(--how);width:100%}
.krrow .pct{font-size:.82rem;color:var(--muted);min-width:3ch}
.truths{display:grid;gap:8px}
.truths .tr{display:flex;gap:8px;align-items:center}
.truths .tr input{flex:1}
.settle{display:grid;gap:16px;padding:22px 24px;border-radius:28px 22px 30px 24px/24px 30px 22px 28px;
  background:radial-gradient(120% 90% at 20% 0%,color-mix(in srgb,var(--why-soft) 85%,transparent),transparent 70%),radial-gradient(90% 80% at 100% 100%,var(--how-soft),transparent 70%)}
.settle p.imag{font-family:var(--display);font-size:1.12rem;line-height:1.65;max-width:62ch;margin:0}
.settle .opts .opt{font-size:.88rem}
.lifeq{display:grid;gap:8px}
.lifeq label{font-family:var(--display);font-weight:450;font-size:1.08rem;line-height:1.4}
.closing{display:grid;gap:12px;padding:16px 18px;border-radius:22px 18px 24px 20px;background:color-mix(in srgb,var(--sheet) 70%,transparent);border:1px solid var(--line)}
.closing .row{align-items:center}
/* life experiences: a ledger of things to live */
.ledger{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.ledger .col{display:grid;gap:12px;align-content:start}
.ticket{display:grid;gap:7px;text-align:left;padding:16px 20px 16px 24px;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--sheet-solid);position:relative;
  border-radius:18px 24px 20px 26px/24px 18px 26px 20px;transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.ticket::before{content:"";position:absolute;left:9px;top:16px;bottom:16px;border-left:2px dotted var(--rule)}
.ticket:hover{transform:translateY(-2px) rotate(-.2deg);box-shadow:var(--shadow)}
.ticket .t{font-weight:800;font-size:1.02rem}
.ticket .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.ticket.lived{background:linear-gradient(160deg,var(--what-soft),var(--sheet-solid) 70%)}
.ticket.lived .stamp{position:absolute;right:16px;top:12px;font-family:var(--hand);font-size:1.15rem;color:var(--what-ink);transform:rotate(-6deg)}
@media (max-width:900px){ .horizons{grid-template-columns:repeat(2,minmax(0,1fr))} .ledger{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .krrow{grid-template-columns:minmax(0,1fr) auto} .krrow input[type=range]{grid-column:1/-1;grid-row:2} .letter{grid-template-columns:30px minmax(0,1fr);gap:10px} .letter>span{font-size:1.5rem} }
/* ways in: three doors into the same house */
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.way{display:grid;gap:5px;align-content:start;text-align:left;padding:14px 16px 15px;cursor:pointer;color:var(--ink);border:1px solid var(--line);
  border-radius:24px 18px 26px 20px/20px 26px 18px 24px;transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.way:nth-child(2){border-radius:18px 26px 20px 24px/26px 18px 24px 20px}
.way:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.way.What{background:var(--what-soft)}.way.How{background:var(--how-soft)}.way.Why{background:var(--why-soft)}
.way .k{font-family:var(--hand);font-size:1.15rem;line-height:1;color:var(--muted)}
.way.What .k{color:var(--what-ink)}.way.How .k{color:var(--how-ink)}.way.Why .k{color:var(--why-ink)}
.way b{font-family:var(--display);font-weight:450;font-size:1.12rem;line-height:1.2}
.way span:last-child{font-size:.88rem;line-height:1.45;color:var(--muted)}
.path em{margin-left:auto;font-style:normal;font-family:var(--hand);font-size:1rem;color:var(--accent)}
[aria-invalid="true"]{outline:2px solid var(--danger);outline-offset:2px}
@media (max-width:720px){ .ways{grid-template-columns:minmax(0,1fr)} }
/* the guide: five breaths through the framework */
.dialog.guide{width:min(760px,100%);gap:20px;padding:34px 36px 28px}
.guide .art{display:flex;justify-content:center}
.guide .art .pyr-art{max-width:300px}
.guide h2{font-size:clamp(1.6rem,3.4vw,2.1rem);line-height:1.15}
.guide .body{display:grid;gap:14px}
.guide .body p{max-width:62ch}
.guide .layers{display:grid;gap:10px}
.guide .gl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start;padding:12px 16px;border-radius:22px 18px 24px 16px/18px 24px 16px 22px}
.guide .gl.Why{background:var(--why-soft)}.guide .gl.How{background:var(--how-soft)}.guide .gl.What{background:var(--what-soft)}
.guide .gl b{font-family:var(--display);font-weight:450;font-size:1.25rem}
.guide .gl ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:.92rem}
.guide .gl li strong{font-weight:700}
.guide .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.guide .two>div{padding:14px 18px;border:1px solid var(--line);border-radius:20px 24px 18px 26px;display:grid;gap:4px}
.guide .two .k{font-family:var(--hand);font-size:1.3rem;line-height:1}
.guide ol.flow{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:f}
.guide ol.flow li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:baseline}
.guide ol.flow li::before{counter-increment:f;content:counter(f);font-family:var(--hand);font-size:1.25rem;color:var(--muted);text-align:center}
.guide .lensrow{display:flex;flex-wrap:wrap;gap:6px}
.guide .lensrow span{font-size:.84rem;padding:4px 11px;border-radius:999px;background:var(--why-soft);color:var(--why-ink);font-weight:700}
.guide .lensrow span.own{background:var(--what-soft);color:var(--what-ink)}
.guide .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.pebbles{display:flex;gap:7px;align-items:center}
.pebbles button{width:13px;height:11px;padding:0;border:1.5px solid var(--rule);background:transparent;cursor:pointer;border-radius:58% 42% 52% 48%/55% 50% 50% 45%;transition:transform .5s var(--spring),background .4s}
.pebbles button[aria-current="step"]{background:var(--accent);border-color:var(--accent);transform:scale(1.3)}
@media (max-width:900px){
  .home{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .home .chat{min-height:0}
  .home .stream,.home .chat.begin .stream{height:auto;max-height:none;min-height:240px;padding:22px 18px}
}
@media (max-width:560px){
  .dialog.guide{padding:24px 20px 20px}
  .guide .two{grid-template-columns:minmax(0,1fr)}
  .guide .gl{grid-template-columns:minmax(0,1fr);gap:6px}
}
@media (max-width:640px){ .split{grid-template-columns:minmax(0,1fr)} .scorerow{grid-template-columns:minmax(0,1fr) 70px} .scorerow input[type=range]{grid-column:1/-1;grid-row:2} .bkrow{grid-template-columns:minmax(0,1fr)} .pairrow{grid-template-columns:minmax(0,1fr)} }

@media (max-width:900px){
  .welcome,.journey{grid-template-columns:minmax(0,1fr)}
  .welcome{gap:36px}
  .studio{grid-template-columns:minmax(0,1fr)}
  .brief{position:static;max-height:none}
  .chat{min-height:0}
  .stream{max-height:none;min-height:240px}
  main{padding-block:36px 72px}
  .hero{margin-bottom:32px}
}
@media (max-width:560px){
  body{font-size:16px}
  .tier.what,.tier.how,.tier.why{width:100%}
  .tier{grid-template-columns:minmax(0,1fr)}
  .cell{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .cell .s{margin-top:0;margin-left:auto}
  header .bar-in{gap:6px;border-radius:26px;padding:8px 10px}
  .nav{width:100%;margin-left:0;justify-content:space-between;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:6px 6px;font-size:.84rem;flex:none}
  .plan,.card,.welcome form,.dialog{padding:20px}
  .tabs{width:100%}
}
@media (prefers-reduced-motion:reduce){
  .sky i,.pyr-art .float,.cell.is-next,.slab.is-next,.typing i{animation:none}
  .sky{transition:none}.sky.exhale{animation:none}.ripple{display:none}
  main.enter>*,.msg,.picked li,.dialog,.scrim,.toast{animation:none}
  *{transition-duration:.01ms!important}
}

  function saveChosenBelief(d, a) {

  function parkProblem(d, a) {

  }
  function updateProblem(d, a) {

  function addCommitment(d, a) {

    if (a.context) note(d, a, 'The person ended the session committing to: "' + a.text.trim() + '"');
    if (a.sessionId) d.update('Sessions', function (r) { return r.SessionID === a.sessionId; }, { EndedAt: now(), Focus: a.focus || '', Summary: 'Committed: ' + a.text.trim() });

  function startSession(d, a) {
    var s = { SessionID: uid(), UserID: need(a.userId, 'userId'), StartedAt: now(), EndedAt: '', Focus: '', Summary: '' };

  /* ---------- the coach's context ---------- */
  function lensPrompt(l) { return 'Lens ' + l.order + ' of 7 · ' + l.lens + ' (' + l.kind.toLowerCase() + '). Explore: ' + l.questions + (l.alt ? ' Care note: ' + l.alt : ''); }

  function focusBlock(state, ctx) {
    var p = progress(state);
    var parts = [];
    if (ctx.indexOf('explore:') === 0) {
      var area = ctx.slice(8);
      var st = areaState(state, area);
      var def = areaDef(area);
      var firstEver = state.exploration.filter(function (r) { return r.Area !== area; }).length === 0 && state.chosen.length === 0 && !getPrefs(state.user).premiseHeard;
      parts.push('FOCUS: the Core Beliefs Exploration, area "' + area + '"' + (def ? '' : ' (an area the person named themselves)') + '.');
      if (def && def.weight === 'Tender') parts.push('This is a tender area. Slow down, check in, and make skipping easy.');
      if (area === 'God') parts.push('Every answer is welcome here, including none, doubt and searching. Explore origins and coherence; never evaluate the belief itself.');
      if (firstEver) parts.push('This is the person\'s first area. Briefly share the premise of the exploration in your own words before the first lens.');
      st.lenses.forEach(function (l) {
        if (l.skipped) parts.push('- ' + l.lens + ': skipped by choice.');
        else if (l.response) parts.push('- ' + l.lens + ' (their words so far): ' + clip(l.response, 700));
      });
      if (st.current) {
        parts.push('CURRENT ' + lensPrompt(st.current));
        parts.push('Stay with this lens only, one or two questions at a time. The app records the person\'s replies under this lens. When it feels explored, invite them to tap "Next lens" (or "Skip this lens" if it is hard). Do not move to the next lens yourself.');
      } else {
        parts.push('All seven lenses are explored. Reflect the patterns you notice (echoes, contrasts, inherited beliefs that shrink them) as observations, then invite the person to close the area: one sentence on what they now choose to believe about ' + area + ' and why. They save it with the "Close this area" button, which saves only what they approve.');
      }
      if (st.chosen) parts.push('They already closed this area once with: "' + st.chosen.ChosenBelief + '". They may be revisiting it.');
    } else if (ctx.indexOf('element:') === 0) {
      var name = ctx.slice(8);
      var e = elementDef(name);
      var step = p.steps.filter(function (s) { return s.key === name; })[0];
      parts.push('FOCUS: designing ' + e.layer + ' · ' + e.element + '. In one line: ' + e.oneLine + '.');
      parts.push('Defining question: ' + e.definingQuestion);
      parts.push('A strong draft: ' + e.strongDraft);
      parts.push(step.statement ? 'Their current statement (v' + step.version + ', ' + step.status + '): "' + step.statement + '"' : 'Nothing saved yet for this element.');
      if (name === 'Core Beliefs') parts.push('Synthesize from the chosen beliefs of the Exploration: look across them for themes about self, others and the universe, and help the person distill 3–7 Core Belief statements in their own words.');
      if (name === 'Resources') parts.push('Draw on their strengths and personality results and their learning & skills log (below, if any) to help them take an immodest, honest inventory. Results are self-reported lenses, not verdicts.');
      if (name === 'Resources' && p.entry === 'what' && !step.statement) parts.push('They chose to begin with what is tangible, and this is their first element. Start with what they already have: strengths, skills, knowledge, assets, access, results from any strengths or personality tests they have taken. As things surface, invite them to record them in Inputs (strengths and personality tests, the learning and skills log, goals, life experiences) so the coach can draw on them; the app shows an "Open Inputs" button beneath this conversation. Keep it light, concrete and immodest.');
      if ((name === 'Vision' || name === 'Purpose') && state.goals.some(function (g) { return g.Horizon === 'long' || g.Horizon === 'life'; })) parts.push('Their long-term and life-long goals (below) hold vivid imaginings of the future and of who they hope to become: rich material here. Ask what those imaginings reveal, rather than copying them in.');
      if ((name === 'Strategy' || name === 'Key Activities') && (state.goals.length || state.experiences.length)) parts.push('Their goals and life experiences (below) show where they want their time and energy to go. Test them against the Purpose and help them name the trade-offs, including what to say no to.');
      var gapsBelow = p.steps.filter(function (s) { return s.key !== 'exploration' && !s.done && LAYERS.indexOf(s.layer) < LAYERS.indexOf(e.layer); }).map(function (s) { return s.name; });
      if (gapsBelow.length) parts.push('The layers beneath this one still have gaps (' + gapsBelow.join(', ') + '). The person chose to work here first, and that is welcome: work this element fully. Treat what they make as provisional, to be tested against the foundation once it exists, and say so lightly, never as a barrier. Listen for what their answers imply about the deeper layers (a rule they live by reveals a belief; a cherished activity hints at a purpose) and name it as an invitation to go deeper when it seems alive for them.');
      parts.push('When a draft is captured, suggest where to go next from what they have said, organically, following their energy; draw them steadily toward the elements still missing, and toward the foundation. ' + (p.next && p.next.key !== name ? 'The app\'s default next suggestion is ' + p.next.name + ', but follow the person. ' : '') + 'They choose their next step on the Design page.');
      if (name === 'Relationships' || name === 'Methods' || name === 'Key Activities') parts.push('Where their test results illuminate this element (how they give and receive care, how they take action, which work energizes or drains them), bring them in as observations to test against their experience.');
      var dmRow = designMap(state)[name];
      var pending = state.recs.filter(function (r) { return r.Status === 'Accepted' && r.ActionType === 'revise' && r.ActionElement === name && (!dmRow || r.RespondedAt > dmRow.UpdatedAt); });
      if (pending.length) parts.push('Guidance the person accepted from a congruence review, to work into this element now (it is a new input; start from what they accepted, and remember it is saved only when they capture and approve a new version): ' +
        pending.map(function (r) { return '"' + r.ActionText.replace(' ⟨Skill⟩', '') + '"' + (r.UserNote === 'Adapted' ? ' (adapted in their own words)' : '') + ' — from the card "' + r.Title + ': ' + clip(r.Body, 300) + '", serving their ' + (r.TracesTo || 'Why'); }).join('; '));
      if (e.layer === 'What') {

    } else if (ctx === 'begin') {

      parts.push('FOCUS: the Design page, where the person begins and continues the Core Beliefs Exploration. Beneath this conversation the app shows the suggested areas as stones to tap, a field to name an area of their own, and' + (cbA.length ? ' a "Move on to Core Beliefs" button.' : ' nothing else yet.'));
      if (built.length && !cbA.length) parts.push('They arrive at the foundation after designing ' + built.join(', ') + '. Connect the two lightly: what they have built above will be tested against what they find here.');
      if (!cbA.length && !heard) {

      if (parkedNow) parts.push('They named something pressing when they signed up (listed above). Acknowledge it warmly in one sentence: it is held safely, and it will be worked through the design when the What layer arrives. Offer no fixes for it here.');
      parts.push('Then invite them to choose where to begin. Beneath this conversation the app shows three ways in as cards to tap: (1) lighter, more tangible reflections at the What layer and their Inputs: the strengths, resources, goals and experiences they already have; (2) the How layer: the principles they live by, where their time and energy go, and who walks with them; (3) the deeper, more challenging excavation of the Core Beliefs Exploration at the foundation. All three lead through the whole framework, and the foundation holds everything up, so they will reach it whichever way they come in. Ask what feels right today. If they answer in chat, reflect it and point them to the matching card. Do not begin the work of any layer here. Keep this to a few short paragraphs.');

  function contextBlock(state, ctx) {
    var u = state.user;
    var p = progress(state);
    var L = [];
    L.push('# Live context from the app (private; use it, do not recite it)');
    L.push('Today: ' + new Date().toDateString() + '.');
    L.push('Person: ' + u.Name + '.' + (truthy(u.PlainStyle) ? ' They asked for plain, simple language: keep the play light and the clarity high.' : ''));
    if (u.WhatBroughtYou) L.push('What brought them here: "' + clip(u.WhatBroughtYou, 600) + '"');
    if (u.HopedChange) L.push('What they hope will be different: "' + clip(u.HopedChange, 600) + '"');
    L.push('Journey (the framework\'s hierarchy, foundation first; ✓ = has a first draft): ' + p.steps.map(function (s) { return (s.done ? '✓ ' : '· ') + s.name; }).join(' | '));
    L.push('Way in: ' + (p.entry ? 'they chose to begin at ' + ENTRIES[p.entry] : 'not chosen yet') + '.' + (p.next && !p.allDrafted ? ' The app\'s default suggestion for what comes next: ' + p.next.name + '.' : ''));

        L.push('- ' + layer + ' · ' + s.name + ': ' + (s.statement ? '"' + clip(s.statement, 900) + '" (v' + s.version + ', ' + s.status + ')' : '(gap)'));

  function toModelMessages(history) {
    var out = [];
    history.forEach(function (m) {
      var role = m.Role === 'assistant' ? 'assistant' : 'user';
      var content = String(m.Content || '');
      if (out.length && out[out.length - 1].role === role) out[out.length - 1].content += '\n\n' + content;
      else out.push({ role: role, content: content });
    });
    if (!out.length || out[0].role !== 'user') out.unshift({ role: 'user', content: '[note] The person opened this session.' });
    if (out[out.length - 1].role !== 'user') out.push({ role: 'user', content: '[note] The person has returned to this conversation. Reconnect briefly: recall where you left off and ask what has changed.' });
    return out;
  }

  /* Prepare one coaching turn. mode: 'chat' (with message), 'open' (no message), 'draft' (propose wording). */
  function coachPrepare(d, a) {
    var ctx = need(a.context, 'context');
    var state = getState(d, a);
    var mode = a.mode || 'chat';
    if (mode === 'review') return reviewPrepare(d, a);
    if (ctx === 'iterate' && !progress(state).allDrafted) throw new Error('Iteration begins once all nine elements have a first draft.');
    if (ctx.indexOf('element:') === 0 && !elementDef(ctx.slice(8))) throw new Error('Unknown element: ' + ctx.slice(8));
    if (mode === 'chat') {
      var msg = need(a.message, 'Message');
      if (ctx.indexOf('explore:') === 0) {
        var st = areaState(state, ctx.slice(8));
        if (st.current) writeLens(d, { userId: a.userId, area: st.area, lensOrder: st.current.order, append: msg });
        state = getState(d, a);
      }
      addMessage(d, a.userId, a.sessionId, ctx, 'user', msg);
    }

      var task;
      if (ctx.indexOf('explore:') === 0) {
        task = 'TASK FOR THE APP (not a chat reply): From this conversation, propose the one-sentence belief the person seems to be choosing about "' + ctx.slice(8) + '", and the reason they gave, using their own words as much as possible. Reply with exactly two lines:\nBelief: <one sentence>\nWhy: <one sentence>\nIf they have not yet said enough to do this honestly, reply with exactly: NOT_ENOUGH';
      } else {
        var e = elementDef(ctx.slice(8));

      }

    }

  function coachRecord(d, a, prepared, text) {
    text = String(text || '').trim();
    if (prepared.mode === 'review') return reviewRecord(d, a, text);
    if (prepared.mode === 'draft') {
      if (/^NOT_ENOUGH/.test(text)) return { draft: null, notEnough: true };
      if (prepared.context.indexOf('explore:') === 0) {
        var b = (text.match(/Belief:\s*(.+)/i) || [])[1] || text;
        var w = (text.match(/Why:\s*(.+)/i) || [])[1] || '';
        return { draft: { belief: b.trim(), why: w.trim() } };
      }
      return { draft: text };
    }
    var m = addMessage(d, a.userId, a.sessionId, prepared.context, 'assistant', text);
    if ((prepared.context === 'begin' || prepared.context.indexOf('explore:') === 0) && text) {
      var u = mine(d, 'Users', a.userId)[0];
      if (u && !getPrefs(u).premiseHeard) savePrefs(d, { userId: a.userId, prefs: { premiseHeard: true }, silent: true });
    }
    return { reply: m };
  }

  /* =====================================================================
     Phase A · supplementary inputs, iteration loop, nudges
     ===================================================================== */
  var TESTS = FW.tests;
  function testDef(key) { return TESTS.filter(function (t) { return t.key === key; })[0]; }
  function parseJSON(s, fallback) { try { return s ? JSON.parse(s) : fallback; } catch (e) { return fallback; } }

  /* ---------- preferences ---------- */
  var NUDGE_TYPES = [
    { key: 'reflection', label: 'Reflection prompts', hint: 'A nudge to journal when it has been a while.' },
    { key: 'recommendations', label: 'Guidance waiting', hint: 'When a review has left cards for you to accept or decline.' },
    { key: 'review', label: 'Review reminders', hint: 'A congruence review every two weeks, and a deeper look at your Why each quarter.' },
    { key: 'commitments', label: 'Small steps', hint: 'A check on steps you committed to more than a week ago.' },
    { key: 'inputs', label: 'Inputs', hint: 'Suggestions to add strengths results or log what you are learning.' }
  ];
  function getPrefs(user) {
    var p = parseJSON(user && user.Prefs, {}) || {};
    var types = {};
    NUDGE_TYPES.forEach(function (t) { types[t.key] = !(p.types && p.types[t.key] === false); });
    return { nudges: p.nudges !== false, email: p.email !== false, types: types, lastEmailAt: p.lastEmailAt || '',
      guideSeen: p.guideSeen === true, premiseHeard: p.premiseHeard === true, focus: p.focus || '', entry: p.entry || '',
      seenRelease: p.seenRelease || '', explored: Array.isArray(p.explored) ? p.explored : [] };
  }
  function savePrefs(d, a) {
    var cur = getPrefs(mine(d, 'Users', a.userId)[0]);
    var next = a.prefs || {};
    var merged = {
      nudges: next.nudges !== undefined ? !!next.nudges : cur.nudges,
      email: next.email !== undefined ? !!next.email : cur.email,
      types: Object.assign({}, cur.types, next.types || {}),
      lastEmailAt: next.lastEmailAt !== undefined ? next.lastEmailAt : cur.lastEmailAt,
      guideSeen: next.guideSeen !== undefined ? !!next.guideSeen : cur.guideSeen,
      premiseHeard: next.premiseHeard !== undefined ? !!next.premiseHeard : cur.premiseHeard,
      focus: next.focus !== undefined ? String(next.focus || '') : cur.focus,
      entry: next.entry !== undefined ? (ENTRIES[next.entry] ? next.entry : '') : cur.entry,
      seenRelease: next.seenRelease !== undefined ? String(next.seenRelease || '').slice(0, 40) : cur.seenRelease,
      explored: cur.explored.concat([].concat(next.explore || []).map(function (k) { return String(k).slice(0, 60); })
        .filter(function (k, i, all) { return k && cur.explored.indexOf(k) < 0 && all.indexOf(k) === i; })).slice(-100)
    };
    var patch = { Prefs: JSON.stringify(merged) };
    if (next.focus) patch.CurrentFocus = /^element:/.test(next.focus) ? next.focus.slice(8) : 'Core Beliefs Exploration';
    d.update('Users', function (r) { return r.UserID === a.userId; }, patch);
    return a.silent ? merged : getState(d, a);
  }

  /* ---------- assessments ---------- */
  function summarizeAssessment(key, v) {
    var t = testDef(key); if (!t || !v) return '';
    function groupOf(field, name) { var o = (field.options || []).filter(function (x) { return x.v === name; })[0]; return o ? (o.g || o.code || '') : ''; }
    switch (key) {
      case 'clifton': case 'via': {
        var f = t.fields[0], list = v[f.key] || [];
        if (!list.length) return '';
        var top = list.slice(0, 5);
        var counts = {}; top.forEach(function (n) { var g = groupOf(f, n); counts[g] = (counts[g] || 0) + 1; });
        var lead = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];
        return (key === 'via' ? 'Signature strengths: ' : 'Top 5: ') + top.join(', ') + (lead && counts[lead] > 1 ? ' (mostly ' + lead + ')' : '') + (list.length > 5 ? ' · ' + list.length + ' ranked' : '');
      }
      case 'mbti': {

    if (openG.length) { L.push('Goals they hold (their own words):'); openG.slice(-12).forEach(function (g) { L.push(goalLine(g)); }); }
    if (doneG.length) { L.push('Goals they accomplished:'); doneG.slice(-5).forEach(function (g) { L.push('- ' + clip(g.Title, 120) + ' (' + g.CompletedOn + ')' + (g.Learned ? ' — what they learned: "' + clip(g.Learned, 240) + '"' : '')); }); }
    var openX = exps.filter(function (x) { return x.Status === 'Open'; }), doneX = exps.filter(function (x) { return x.Status === 'Done'; });
    if (openX.length) { L.push('Life experiences they hope to have:'); openX.slice(-12).forEach(function (x) { L.push('- ' + clip(x.Title, 120) + (x.TargetWhen ? ' (' + clip(x.TargetWhen, 40) + ')' : '') + (x.Description ? ' — ' + clip(x.Description, 160) : '') + (x.Impediments ? '; in the way: ' + clip(x.Impediments, 120) : '')); }); }
