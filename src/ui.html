<title>Life in Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Nunito+Sans:ital,wght@0,300..800;1,300..600&family=Caveat:wght@400..600&display=swap">
<style>
/* Layout: a cairn on a riverbank. Stones are stacked from the ground up (Why, How, What); the page is linen under drifting fog,
   with wide margins to breathe, and nothing snaps: it settles. */
:root{
  /* Mist & Stone · the ground */
  --paper:#F5F2EB; --sheet:rgba(250,248,245,.80); --sheet-solid:#FAF8F5; --ink:#2C302E; --muted:#65675F; --rule:#D4CDC3; --line:rgba(196,187,174,.62);
  /* Forest Floor · the hand */
  --accent:#525B44; --accent-ink:#F5F2EB; --sand:#C5A880; --driftwood:#9C8470; --oat:#EAE3D2;
  /* the cairn: stone (Why), wood (How), leaf (What) */
  --why:#708090; --why-ink:#52616F; --why-soft:#E3EBF0;
  --how:#9C8470; --how-ink:#6E5B4A; --how-soft:#EAE3D2;
  --what:#8A9A86; --what-ink:#56664F; --what-soft:#E1E6DA;
  --me:#E5E9DE; --danger:#9B4A36; --glow:rgba(138,154,134,.38);
  /* Horizon · the sky (shifts with the hour) */
  --s1:#E3EBF0; --s2:#D6C7BD; --s3:#EAE3D2; --s4:#DCE2D5; --sky-o:.78;
  --shadow:5px 12px 32px -18px rgba(82,70,52,.30), 1px 2px 5px rgba(82,70,52,.05);
  --shadow-lift:9px 22px 44px -20px rgba(82,70,52,.38), 2px 4px 8px rgba(82,70,52,.06);
  --grain-o:.42; --grain-blend:multiply;
  --display:'Fraunces', 'Iowan Old Style', Georgia, serif;
  --body:'Nunito Sans', 'Avenir Next', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --hand:'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
  --mono:var(--body);
  --r:28px; --r-sm:18px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.3,1);
}
:root[data-tod="dawn"]{ --s1:#F0E1D5; --s2:#E3EBF0; --s3:#EBDCCB; --s4:#E4E8DD }
:root[data-tod="dusk"]{ --s1:#D6C7BD; --s2:#CDD3DA; --s3:#E6D4C1; --s4:#D8DCD0 }
:root[data-tod="night"]{ --s1:#D2DAE2; --s2:#CCC5BE; --s3:#DDD6CA; --s4:#CDD5CB }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1B1E1C; --sheet:rgba(37,41,38,.82); --sheet-solid:#252926; --ink:#ECE7DD; --muted:#A9A69C; --rule:#3E433E; --line:rgba(96,102,94,.5);
  --accent:#AAB78F; --accent-ink:#1B1E1C; --sand:#C5A880; --driftwood:#B59C86; --oat:#2E2B25;
  --why:#93A3B3; --why-ink:#B0BECB; --why-soft:#26313A; --how:#B59C86; --how-ink:#CFB8A2; --how-soft:#342E27; --what:#A3B39E; --what-ink:#BECCB8; --what-soft:#29322A;
  --me:#2C382D; --danger:#E3967F; --glow:rgba(170,183,143,.30);
  --s1:#22303A; --s2:#3A3029; --s3:#26302A; --s4:#2F2C31; --sky-o:.9;
  --shadow:5px 12px 32px -18px rgba(0,0,0,.65), 1px 2px 5px rgba(0,0,0,.25); --shadow-lift:9px 22px 44px -20px rgba(0,0,0,.75), 2px 4px 8px rgba(0,0,0,.3);
  --grain-o:.32; --grain-blend:overlay; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1B1E1C; --sheet:rgba(37,41,38,.82); --sheet-solid:#252926; --ink:#ECE7DD; --muted:#A9A69C; --rule:#3E433E; --line:rgba(96,102,94,.5);
  --accent:#AAB78F; --accent-ink:#1B1E1C; --sand:#C5A880; --driftwood:#B59C86; --oat:#2E2B25;
  --why:#93A3B3; --why-ink:#B0BECB; --why-soft:#26313A; --how:#B59C86; --how-ink:#CFB8A2; --how-soft:#342E27; --what:#A3B39E; --what-ink:#BECCB8; --what-soft:#29322A;
  --me:#2C382D; --danger:#E3967F; --glow:rgba(170,183,143,.30);
  --s1:#22303A; --s2:#3A3029; --s3:#26302A; --s4:#2F2C31; --sky-o:.9;
  --shadow:5px 12px 32px -18px rgba(0,0,0,.65), 1px 2px 5px rgba(0,0,0,.25); --shadow-lift:9px 22px 44px -20px rgba(0,0,0,.75), 2px 4px 8px rgba(0,0,0,.3);
  --grain-o:.32; --grain-blend:overlay; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:360;line-height:1.08;text-wrap:balance;margin:0;font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.012em}
h1{font-size:clamp(2.5rem,5.6vw,4.3rem);font-weight:320}
h2{font-size:clamp(1.65rem,3.2vw,2.35rem)}
h3{font-size:1.3rem;font-weight:420}
h1 em,h2 em{font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1}
p{margin:0}
.mono{font-family:var(--body);font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.muted{color:var(--muted)}
.hand{font-family:var(--hand);font-weight:500;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* atmosphere: fog that drifts, paper that breathes */
.sky{position:fixed;inset:-12vmax;z-index:-2;pointer-events:none;overflow:hidden;opacity:var(--sky-o);transform:rotate(var(--phase,0deg));transition:transform 9s var(--ease)}
.sky i{position:absolute;display:block;width:56vmax;height:48vmax;filter:blur(64px);border-radius:46% 54% 60% 40%/50% 42% 58% 50%;
  animation:drift 80s ease-in-out infinite alternate, morph 26s ease-in-out infinite alternate;will-change:transform}
.sky .b1{background:var(--s1);top:0;left:4vmax}
.sky .b2{background:var(--s2);top:16vmax;right:0;animation-duration:96s,31s;animation-delay:-30s,-9s}
.sky .b3{background:var(--s3);bottom:0;left:36vmax;animation-duration:88s,29s;animation-delay:-50s,-14s}
.sky .b4{background:var(--s4);top:42vmax;left:0;width:42vmax;height:38vmax;animation-duration:110s,37s;animation-delay:-70s,-4s}
.sky.exhale{animation:exhale 6s var(--ease)}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(7vmax,5vmax) scale(1.09)}100%{transform:translate(-5vmax,8vmax) scale(.94)}}
@keyframes morph{0%{border-radius:46% 54% 60% 40%/50% 42% 58% 50%}100%{border-radius:60% 40% 36% 64%/42% 60% 40% 58%}}
@keyframes exhale{0%{filter:none}35%{filter:saturate(1.35) brightness(1.05)}100%{filter:none}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--grain-o);mix-blend-mode:var(--grain-blend);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .32 0 0 0 0 .27 0 0 0 0 .21 0 0 0 .5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.ripple{position:fixed;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid var(--what);border-radius:47% 53% 50% 50%/52% 48% 52% 48%;pointer-events:none;z-index:45;opacity:.55;animation:ripple 2.8s var(--ease) forwards}
.ripple.r2{animation-delay:.35s;border-color:var(--sand);opacity:0}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(46);opacity:0}}

/* shell */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 10px 8px 18px;border-radius:999px;
  background:var(--sheet);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);border:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:400;font-size:1.32rem;letter-spacing:-.01em;font-variation-settings:"SOFT" 100}
.brand svg{width:30px;height:30px;flex:none;transition:transform .9s var(--spring)}
.brand:hover svg{transform:rotate(-6deg) translateY(-1px)}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.93rem;transition:background .5s var(--ease),color .4s,transform .5s var(--spring)}
.nav button:hover{color:var(--ink);transform:translateY(-1px)}
.nav button[aria-current="page"]{background:var(--what-soft);color:var(--ink)}
.preview-tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--how-ink);background:var(--how-soft);border-radius:999px;padding:3px 10px}
main{max-width:1180px;margin:0 auto;padding-block:52px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.enter>*{animation:rise .9s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.08s}main.enter>*:nth-child(3){animation-delay:.16s}main.enter>*:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:.25;transform:translateY(14px)}to{opacity:1;transform:none}}
footer{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between;color:var(--muted);font-size:.86rem;position:relative;
  padding-block:34px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wave{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:0;height:14px;background:var(--rule);opacity:.9;
  -webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='14'%3E%3Cpath d='M0 7 C 22 2, 38 12, 60 7 S 98 3, 120 8 S 158 11, 180 7' fill='none' stroke='black' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E") repeat-x center/180px 14px;
  mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='14'%3E%3Cpath d='M0 7 C 22 2, 38 12, 60 7 S 98 3, 120 8 S 158 11, 180 7' fill='none' stroke='black' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E") repeat-x center/180px 14px}

/* controls: everything gives a little, then settles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet-solid);color:var(--ink);
  padding:11px 20px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;
  transition:transform .6s var(--spring),box-shadow .6s var(--ease),background .4s,border-color .4s}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--shadow);border-color:var(--rule)}
.btn:active{transform:scale(.97);transition-duration:.12s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -12px var(--accent)}
.btn.primary:hover{box-shadow:0 14px 28px -14px var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:12px;box-shadow:none}
.btn.ghost:hover{color:var(--ink);background:var(--sheet);box-shadow:none}
.btn.small{padding:7px 14px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
label{display:block;font-weight:700;font-size:.93rem;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:.87rem}
input[type=text],input[type=email],textarea{width:100%;border:1px solid var(--line);background:var(--sheet-solid);border-radius:var(--r-sm);padding:12px 16px;line-height:1.5;
  transition:box-shadow .5s var(--ease),border-color .4s}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--what);box-shadow:0 0 0 5px var(--glow)}
.field{display:grid;gap:2px}
.choice{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0;cursor:pointer}
.choice input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:3px 11px;white-space:nowrap;
  background:color-mix(in srgb,currentColor 13%,transparent)}
.chip.approved{color:var(--what-ink)}
.chip.draft{color:var(--how-ink)}
.chip.gap{color:var(--muted);background:transparent;border:1px dashed var(--rule)}
.chip.locked{color:var(--muted);opacity:.75}
.chip.next{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--danger);font-size:.92rem}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-family:var(--body);font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.16rem;color:var(--muted);max-width:56ch;line-height:1.6}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:12px 22px;border-radius:999px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow-lift);animation:float-in .7s var(--spring)}
@keyframes float-in{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

/* welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start}
.welcome .intro{display:grid;gap:22px;padding-top:12px;padding-left:clamp(0px,3vw,40px)}
.welcome .intro p{max-width:54ch}
.welcome form{padding:30px;display:grid;gap:20px;border-radius:36px 28px 34px 30px/30px 34px 28px 36px}
.pyr-art{width:100%;max-width:440px;height:auto;overflow:visible}
.pyr-art .float{animation:settle 7s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes settle{from{transform:translateY(0) rotate(0)}to{transform:translateY(-3px) rotate(-1.2deg)}}
.tiny-legend{display:grid;gap:8px;font-size:.95rem}
.tiny-legend span{display:inline-block;width:14px;height:11px;border-radius:55% 45% 50% 50%/60% 55% 45% 40%;margin-right:10px;vertical-align:middle}

/* journey: the cairn */
.hero{display:grid;gap:12px;margin-bottom:44px;padding-left:clamp(0px,4vw,56px)}
.hero h1{max-width:18ch}
.journey{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:32px;align-items:start}
.plan{padding:28px 24px 22px;display:grid;gap:12px;justify-items:center;position:relative;border-radius:40px 32px 44px 34px/34px 40px 32px 42px}
.plan-head{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tier.what{width:68%}.tier.how{width:86%}.tier.why{width:100%}
.tier-label{width:100%;display:flex;align-items:center;gap:12px;font-family:var(--hand);font-size:1.22rem;color:var(--muted);line-height:1}
.tier-label::after{content:"";flex:1;height:8px;background:var(--rule);opacity:.8;
  -webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8'%3E%3Cpath d='M0 4 C 18 1, 32 7, 50 4 S 86 2, 120 5' fill='none' stroke='black' stroke-width='1.2'/%3E%3C/svg%3E") repeat-x center/120px 8px;
  mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='8'%3E%3Cpath d='M0 4 C 18 1, 32 7, 50 4 S 86 2, 120 5' fill='none' stroke='black' stroke-width='1.2'/%3E%3C/svg%3E") repeat-x center/120px 8px}
.tier.what+.tier-label,.tier.how+.tier-label{margin-top:6px}
.cell{position:relative;text-align:left;border:1px solid var(--line);padding:12px 14px 12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:6px;
  background:var(--sheet-solid);border-radius:28px 22px 30px 20px/24px 30px 20px 28px;box-shadow:var(--shadow);
  transition:transform .7s var(--spring),box-shadow .6s var(--ease),border-color .4s}
.tier .cell:nth-child(2){border-radius:22px 30px 24px 30px/30px 22px 28px 22px}
.tier .cell:nth-child(3){border-radius:30px 24px 22px 32px/22px 28px 30px 24px}
.cell:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:var(--shadow-lift)}
.cell .n{font-family:var(--hand);font-size:1rem;color:var(--muted);line-height:1}
.cell .t{font-weight:700;line-height:1.25;font-size:.98rem;overflow-wrap:anywhere}
.cell .s{margin-top:auto}
.cell.done.L-Why{background:var(--why-soft);border-color:color-mix(in srgb,var(--why) 35%,transparent)}
.cell.done.L-How{background:var(--how-soft);border-color:color-mix(in srgb,var(--how) 35%,transparent)}
.cell.done.L-What{background:var(--what-soft);border-color:color-mix(in srgb,var(--what) 40%,transparent)}
.cell.locked{opacity:.5;border-style:dashed;cursor:default;box-shadow:none;background:transparent}
.cell.locked:hover{transform:none;box-shadow:none}
.cell.is-next,.slab.is-next{animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:var(--shadow),0 0 0 0 var(--glow)}50%{box-shadow:var(--shadow),0 0 0 9px var(--glow)}}
.slab{width:100%;border:1px solid color-mix(in srgb,var(--why) 30%,transparent);padding:16px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;cursor:pointer;text-align:left;
  background:radial-gradient(120% 140% at 15% 0%,color-mix(in srgb,var(--sheet-solid) 55%,transparent),transparent 60%),var(--why-soft);
  border-radius:46px 38px 50px 34px/30px 36px 26px 32px;box-shadow:var(--shadow);transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.slab:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.slab .t{font-weight:700;font-family:var(--display);font-size:1.15rem;font-weight:450}
.ground{width:100%;text-align:center;font-family:var(--hand);font-size:1.1rem;color:var(--muted);padding-top:2px}
.side{display:grid;gap:18px}
.card{padding:24px;display:grid;gap:12px}
.card h3{font-size:1.2rem}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}

/* explore */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.area{padding:18px;display:grid;gap:10px;text-align:left;cursor:pointer;border-radius:26px 20px 28px 22px/22px 28px 20px 26px;border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow);
  transition:transform .7s var(--spring),box-shadow .6s var(--ease)}
.area:nth-child(3n+2){border-radius:20px 28px 22px 26px/28px 20px 26px 22px}
.area:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.area .t{font-weight:700;font-size:1.04rem}
.ticks{display:flex;gap:5px}
.ticks i{width:16px;height:7px;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;background:var(--rule)}
.ticks i.on{background:var(--why)}
.ticks i.skip{background:transparent;border:1px dashed var(--rule)}
.ticks i.cur{background:var(--accent)}
.area .belief{font-family:var(--display);font-size:.98rem;color:var(--muted);font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1}
.add-area{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.add-area .field{flex:1;min-width:200px}

/* studio: a quiet room for one conversation */

/* ---------- hosted backend: the server runs the engine as the signed-in person ---------- */
var Hosted = (function(){
  if (!HOSTED) return null;
  var sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit' }
  });
  function session(){ return sb.auth.getSession().then(function(r){ return r && r.data ? r.data.session : null; }); }
  function signedOut(){ var e = new Error('Please sign in again.'); e.code = 'signed_out'; return e; }
  function call(action, args, onText){
    return session().then(function(ses){
      if (!ses) throw signedOut();
      return fetch('/api/'+action, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+ses.access_token }, body: JSON.stringify({ args:args }) });
    }).then(function(res){
      if (res.status === 401) throw signedOut();
      var type = res.headers.get('Content-Type') || '';
      if (res.ok && type.indexOf('ndjson') >= 0) return readStream(res, onText);
      return res.json().catch(function(){ return { error:'The app could not be reached. Check your connection and try again.' }; }).then(function(j){
        if (!res.ok || j.error) throw new Error(j.error || 'Something went wrong. Try again.');
        return j.result;
      });
    }, function(e){
      if (e && e.code) throw e;
      throw new Error('The app could not be reached. Check your connection and try again.');
    });
  }
  function readStream(res, onText){
    var reader = res.body.getReader(), decoder = new TextDecoder(), buf = '', result, error;
    function handle(line){
      if (!line.trim()) return;
      var m; try { m = JSON.parse(line); } catch(e){ return; }
      if (m.t === 'text' && onText) onText(m.text);
      else if (m.t === 'done') result = m.result;
      else if (m.t === 'error') error = m.error;
    }
    function pump(){
      return reader.read().then(function(r){
        if (r.done){ handle(buf); if (error) throw new Error(error); if (result === undefined) throw new Error('The coach was interrupted. Try again.'); return result; }
        buf += decoder.decode(r.value, { stream:true });
        var i; while ((i = buf.indexOf('\n')) >= 0){ handle(buf.slice(0, i)); buf = buf.slice(i+1); }
        return pump();
      });
    }
    return pump();
  }
  function sendLink(email){
    return sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo: location.origin + location.pathname, shouldCreateUser:true } }).then(function(r){
      if (!r.error) return true;
      var msg = String(r.error.message || ''), status = r.error.status || 0;
      if (/invite-only|database error|signups? not allowed/i.test(msg)) throw new Error('Life in Design is invite-only during the alpha. If you would like to join, ask for an invitation.');
      if (/not authori[sz]ed/i.test(msg)) throw new Error('Sign-in emails can\'t be sent to this address yet: the app\'s email sender still needs to be set up.');
      if (status === 429 || /rate limit|too many/i.test(msg)) throw new Error('Too many sign-in emails just now. Wait a few minutes and try again.');
      throw new Error('The sign-in email could not be sent: ' + msg);
    });
  }
  return {
    session: session, api: call, sendLink: sendLink,
    signOut: function(){ return sb.auth.signOut().catch(function(){}); },
    onChange: function(fn){ sb.auth.onAuthStateChange(function(ev, ses){ fn(ev, ses); }); }
  };
})();

function api(action, args, onText){

}

var lastPt = null;

function setTimeOfDay(){
  var h = new Date().getHours();
  document.documentElement.setAttribute('data-tod', h>=5&&h<10 ? 'dawn' : h>=10&&h<17 ? 'day' : h>=17&&h<21 ? 'dusk' : 'night');
}
var phase = 0;
try { phase = Number(localStorage.getItem('lid.phase')) || 0; } catch(e){}
function applyPhase(){ var sky = $('.sky'); if (sky) sky.style.setProperty('--phase', phase+'deg'); }
function breathe(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  phase = (phase + 28) % 360; applyPhase();
  try { localStorage.setItem('lid.phase', String(phase)); } catch(e){}
  if (reduce) return;
  var sky = $('.sky'); if (sky){ sky.classList.remove('exhale'); void sky.offsetWidth; sky.classList.add('exhale'); }
  var pt = lastPt || { x: window.innerWidth/2, y: window.innerHeight/2 };
  ['r1','r2'].forEach(function(c){
    var r = document.createElement('span'); r.className = 'ripple '+c; r.setAttribute('aria-hidden','true');
    r.style.left = pt.x+'px'; r.style.top = pt.y+'px'; document.body.appendChild(r);
    setTimeout(function(){ r.remove(); }, 3400);
  });
}
setTimeOfDay(); applyPhase(); setInterval(setTimeOfDay, 15*60*1000);

    }

/* ---------- coaching ---------- */
function coachTurn(opts){
  if (S.busy) return;
  S.busy = true; S.coachErr = null; render();
  var ctx = S.ctx;
  api('coach', { context:ctx, mode:opts.mode, message:opts.message }, function(text){ if(S.ctx===ctx) paintStream(text); })
    .then(function(r){ if (r.reply) S.messages.push(r.reply); })
    .catch(function(e){ S.coachErr = e.message || String(e); })
    .then(function(){ return ctx.indexOf('explore:')===0 ? api('getState').then(setState).catch(function(){}) : null; })
    .then(function(){ S.busy=false; if(S.ctx===ctx && S.view==='studio'){ render(); var m=$('#msg'); if(m) m.focus(); } });
}

function openCtx(ctx){
  S.ctx = ctx; S.messages = []; S.coachErr=null; S.view='studio'; render(); window.scrollTo(0,0);
  var pre = ctx.indexOf('explore:')===0 ? api('startArea',{ area:ctx.slice(8) }) : Promise.resolve();
  pre.then(function(){ return api('getState'); }).then(setState)
    .then(function(){ return api('getMessages',{ context:ctx }); })
    .then(function(msgs){
      if (S.ctx!==ctx) return;
      S.messages = msgs || [];
      render();
      var last = S.messages[S.messages.length-1];
      var hasCoach = S.messages.some(function(m){ return m.Role==='assistant'; });
      var stale = last && (Date.now() - new Date(last.Timestamp).getTime() > 8*3600*1000);
      if (!hasCoach || (last && last.Role!=='assistant') || stale) coachTurn({ mode:'open' });
    }).catch(fail);
  var stage = { alignment:'alignment', checkin:'living', remodel:'remodel', iterate:'living' }[ctx];
  if (stage) api('updateUser',{ patch:{ Stage:stage, CurrentFocus:ctxTitle(ctx) } }).then(setState).catch(function(){});
}

function refreshMessages(){ return api('getMessages',{ context:S.ctx }).then(function(m){ S.messages=m||[]; }); }

/* ---------- events ---------- */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]'); if(!t) return;
  var act = t.dataset.act;
  if (act==='scrim'){ if(ev.target===t) closeDialog(); return; }
  if (act==='nav'){ ev.preventDefault(); if(!S.state && t.dataset.view!=='welcome') return; go(t.dataset.view); return; }
  if (act==='step'){
    var p=LID.progress(S.state), s=p.steps.filter(function(x){ return x.key===t.dataset.key; })[0];
    if (!s.unlocked){ var i=p.steps.indexOf(s); toast(s.name+' opens once '+p.steps[i-1].name+' has a first draft.'); return; }
    if (s.key==='exploration') go('explore'); else openCtx('element:'+s.key); return;
  }
  if (act==='ctx'){ openCtx(t.dataset.ctx); return; }
  if (act==='area'){ openCtx('explore:'+t.dataset.area); return; }
  if (act==='back'){ if (S.ctx && S.ctx.indexOf('explore:')===0) go('explore'); else if (S.ctx==='iterate') go('iterate'); else go('journey'); return; }
  if (phaseAClick(act, t, ev)) return;
  if (act==='retry'){ coachTurn({ mode:'open' }); return; }
  if (act==='nextLens' || act==='skipLens'){
    if (S.busy) return;
    api('advanceLens',{ area:S.ctx.slice(8), skip:act==='skipLens' }).then(setState).then(refreshMessages)
      .then(function(){ render(); var as=LID.areaState(S.state,S.ctx.slice(8)); if(as.current || as.complete) coachTurn({ mode:'open' }); }).catch(fail);
    return;
  }
  if (act==='capture'){ captureDraft(); return; }
  if (act==='closeArea'){ closeAreaDialog(); return; }
  if (act==='endSession'){ endSessionDialog(); return; }
  if (act==='cancel'){ closeDialog(); return; }
  if (act==='saveEl'){ saveElement(t.dataset.status); return; }
  if (act==='saveBelief'){ saveBelief(); return; }
  if (act==='saveCommit'){ saveCommit(); return; }
  if (act==='commit'){ api('updateCommitment',{ commitmentId:t.dataset.id, status:t.dataset.status }).then(setState).then(function(){ render(); toast(t.dataset.status==='Done'?'Nicely done.':'Let go. Room for what matters.'); }).catch(fail); return; }
  if (act==='problem'){ api('updateProblem',{ problemId:t.dataset.id, status:t.dataset.status }).then(setState).then(render).catch(fail); return; }
  if (act==='remodel'){ openDialog('<h2>Start a remodel?</h2><p>A remodel revisits your design from the top, at a life transition or when it no longer fits. Your current design and its history stay exactly as they are; you change elements by revisiting them.</p><div class="row"><button class="btn primary" data-act="ctx" data-ctx="remodel">Begin the remodel</button><button class="btn ghost" data-act="cancel">Not now</button></div>'); return; }
  if (act==='copyKey'){
    try { navigator.clipboard.writeText(S.userId).then(function(){ toast('Key copied.'); }, function(){ selectKey(); }); } catch(e){ selectKey(); }
    return;
  }
  if (act==='signOut'){
    if (HOSTED){ Hosted.signOut().then(function(){ S.userId=null; S.state=null; S.sessionId=null; S.email=''; S.linkSentTo=''; go('signin'); }); return; }
    store.del('lid.userId'); S.userId=null; S.state=null; S.sessionId=null; go('welcome'); return;
  }
  if (act==='resendLink'){ var to=S.linkSentTo; t.disabled=true; Hosted.sendLink(to).then(function(){ toast('Sent again to '+to+'.'); }, function(e){ S.linkSentTo=''; S.signinErr=e.message; render(); }); return; }
  if (act==='otherEmail'){ S.linkSentTo=''; S.signinErr=''; render(); return; }
  if (act==='reload'){ location.reload(); return; }
  if (act==='resetPreview'){ openDialog('<h2>Erase the preview data?</h2><p>This clears every design saved in this browser\'s preview. The live app and your Google Sheet are not touched.</p><div class="row"><button class="btn primary" data-act="confirmReset">Erase</button><button class="btn ghost" data-act="cancel">Keep it</button></div>'); return; }
  if (act==='confirmReset'){ Local.reset(); store.del('lid.userId'); S.userId=null; S.state=null; go('welcome'); toast('Preview data erased.'); return; }
  if (act==='useKey'){ var k=($('#ob-key').value||'').trim(); if(!k) return; signIn(k); return; }

function fieldHtml(f, V){
  var val = V[f.key];
  if (f.type==='rank'){
    val = val || [];
    var groups = []; f.options.forEach(function(o){ var g=o.g||''; if(groups.indexOf(g)<0) groups.push(g); });
    var full = val.length >= f.max;
    var lab = function(o){ return o.code ? o.v+' ('+o.code+')' : o.v; };
    var byV = {}; f.options.forEach(function(o){ byV[o.v]=o; });
    return '<p class="bkcount"><span class="'+(val.length>=f.min?'ok':'')+'">'+val.length+(f.min===f.max?' of '+f.min:' added · at least '+f.min)+'</span></p>'+
      (val.length?'<ol class="picked">'+val.map(function(v,i){ var o=byV[v]||{v:v};
        return '<li><span>'+esc(lab(o))+(o.g?'<span class="g">'+esc(o.g)+'</span>':'')+'</span><span class="ctl">'+
          '<button class="icon" type="button" data-act="rk-up" data-f="'+f.key+'" data-i="'+i+'" aria-label="Move up"'+(i===0?' disabled':'')+'>↑</button>'+
          '<button class="icon" type="button" data-act="rk-down" data-f="'+f.key+'" data-i="'+i+'" aria-label="Move down"'+(i===val.length-1?' disabled':'')+'>↓</button>'+
          '<button class="icon" type="button" data-act="rk-rm" data-f="'+f.key+'" data-i="'+i+'" aria-label="Remove">×</button></span></li>'; }).join('')+'</ol>':'')+
      groups.map(function(g){ return '<div class="optgroup">'+(g?'<span class="gl">'+esc(g)+'</span>':'')+'<div class="opts">'+
        f.options.filter(function(o){ return (o.g||'')===g; }).map(function(o){ var on=val.indexOf(o.v)>=0;
          return '<button class="opt" type="button" data-act="rk-add" data-f="'+f.key+'" data-v="'+esc(o.v)+'" aria-pressed="'+on+'"'+(!on&&full?' disabled':'')+'>'+esc(lab(o))+'</button>'; }).join('')+'</div></div>'; }).join('');
  }
  if (f.type==='select' || f.type==='wing'){
    var options = f.options;
    if (f.type==='wing'){
      var ty = Number(V[f.of]); if (!ty) return '<p class="muted">Choose your core type first.</p>';
      var a = ty===1?9:ty-1, b = ty===9?1:ty+1;

        '<input type="number" min="'+f.min+'" max="'+f.max+'" value="'+(has?esc(val[it]):'')+'" placeholder="—" data-inp="score" data-f="'+f.key+'" data-item="'+esc(it)+'" aria-label="'+esc(it)+' score"></div>';

      f.items.map(function(it){ return '<div class="bkrow"><strong style="font-weight:600">'+esc(it)+'</strong><div class="seg" role="group">'+
        f.buckets.map(function(b){ return '<button type="button" data-act="bk" data-f="'+f.key+'" data-item="'+esc(it)+'" data-v="'+b.v+'" aria-pressed="'+(val[it]===b.v)+'">'+esc(b.label)+'</button>'; }).join('')+'</div></div>'; }).join('');
  }
  if (f.type==='text') return '<input type="text" data-inp="text" data-f="'+f.key+'" value="'+esc(val||'')+'" placeholder="'+esc(f.placeholder||'')+'" maxlength="40">';
  return '';
}
function fieldDef(key){ return LID.testDef(S.edit.key).fields.filter(function(f){ return f.key===key; })[0]; }

/* ---------- Iterate ---------- */
var DEPTH = { Why:['Contemplate','The deepest, rarest iteration. Questions to sit with, never answers.'], How:['Challenge','Is your What accomplishing your Why through your How?'], What:['Suggest','Concrete Whats from your strengths, learning, skills and communities.'] };

    var done = p.steps.slice(1).filter(function(s){ return s.done; }).length;
    return hero+'<p class="lede">Iteration begins once your v1 design is formulated, with a first draft of all nine elements. Then your coach becomes an objective evaluator of how well your What carries out your How and Why.</p></section>'+
      '<section class="panel card" style="max-width:640px"><div class="meter"><span class="eyebrow">Your v1 design · '+done+' of 9 drafted</span><div class="bar"><i class="tr" style="width:'+(done/9*100)+'%"></i></div></div>'+
      (p.next?'<div class="row"><button class="btn primary" data-act="step" data-key="'+esc(p.next.key)+'">Continue with '+esc(p.next.name)+'</button></div>':'')+'</section>';
  }
  var lr = LID.latestReview(st);
  var open = st.recs.filter(function(r){ return r.Status==='New'; });
  var communities = st.recs.filter(function(r){ return r.Kind==='community' && r.Status==='Accepted'; });
  var answered = st.recs.filter(function(r){ return r.Status!=='New'; }).slice().reverse();
  var out = hero+'<p class="lede">An objective read of how well your What carries out your How and Why. The Why iterates rarely and deeply, the How a little more often, the What most often.</p>'+
    '<div class="row"><button class="btn primary" data-act="runReview"'+(S.reviewing?' disabled':'')+'>'+(lr?'Run a new review':'Run your first review')+'</button><button class="btn" data-act="ctx" data-ctx="iterate">Talk it through</button></div></section>';
  if (S.reviewing) out += '<section class="panel loading" role="status"><span class="typing"><i></i><i></i><i></i></span><span>Reviewing your design against itself. This can take up to a minute.</span></section>';
  if (S.reviewErr) out += '<p class="err" style="margin-bottom:16px">'+esc(S.reviewErr)+'</p>';
  if (lr){
    var tj = LID.parseJSON(lr.TraceJSON, {trace:[],orphans:[]});
    var n = Number(lr.Total)||0, tr = Number(lr.Traced)||0, wk = tj.trace.filter(function(t){ return t.status==='weak'; }).length;
    out += '<section class="panel card" style="margin-bottom:22px"><div class="row" style="justify-content:space-between;align-items:flex-end"><span class="eyebrow">Congruence review · '+fmtDate(lr.CreatedAt)+'</span></div>'+
      '<div class="meter"><p><span class="score">'+tr+' of '+n+'</span> <span class="muted">What items trace clearly to your How and Why'+(wk?' · '+wk+' weakly':'')+'</span></p>'+
        '<div class="bar" aria-hidden="true"><i class="tr" style="width:'+(n?tr/n*100:0)+'%"></i><i class="wk" style="width:'+(n?wk/n*100:0)+'%"></i></div></div>'+
      '<p style="max-width:70ch">'+esc(lr.Summary)+'</p>'+
      (tj.trace.length?'<details><summary>The trace · item by item</summary><div class="scroll-x" style="margin-top:10px"><table class="trace"><thead><tr><th>Item</th><th>Element</th><th>Serves</th><th>Status</th></tr></thead><tbody>'+
        tj.trace.map(function(t){ return '<tr><td>'+esc(t.item)+(t.note?'<br><span class="muted" style="font-size:.85rem">'+esc(t.note)+'</span>':'')+'</td><td>'+esc(t.element)+'</td><td>'+esc((t.tracesTo||[]).join(', ')||'—')+'</td><td><span class="chip '+t.status+'">'+esc(t.status)+'</span></td></tr>'; }).join('')+'</tbody></table></div></details>':'')+
      (tj.orphans.length?'<div class="block"><span class="eyebrow">Foundation with nothing built on it</span><ul class="list">'+tj.orphans.map(function(o){ return '<li><span class="mono muted">'+esc(o.element)+'</span><span>'+esc(o.text)+(o.note?' <span class="muted">· '+esc(o.note)+'</span>':'')+'</span></li>'; }).join('')+'</ul></div>':'')+
    '</section>';
  } else if (!S.reviewing) {
    out += '<section class="panel card" style="margin-bottom:22px"><p>No review yet. The first one traces every Key Activity, Method and Resource back to your How and Why, then offers guidance at each layer.</p></section>';
  }
  out += '<h2 style="margin-bottom:6px">Guidance</h2><p class="muted" style="margin-bottom:14px">Accept it, adapt it into your own words, or decline it. What you accept becomes a new input to your design.</p>';
  if (open.length){
    ['Why','How','What'].forEach(function(layer){
      var cs = open.filter(function(r){ return r.Layer===layer; }); if(!cs.length) return;
      out += '<div class="depth"><h3 class="layer-tag '+layer+'" style="font-size:.8rem">'+layer+' · '+DEPTH[layer][0]+'</h3><span class="d">'+esc(DEPTH[layer][1])+'</span></div><div class="gcards" style="margin:10px 0 18px">'+cs.map(recCard).join('')+'</div>';
    });
  } else out += '<p class="muted" style="margin-bottom:18px">'+(lr?'No open guidance. What you accepted now lives in your design.':'Guidance appears here after a review.')+'</p>';
  if (communities.length) out += '<section class="panel card" style="margin-bottom:18px"><span class="eyebrow">Communities to look for</span><ul class="list">'+communities.map(function(r){ return '<li><strong style="font-weight:600">'+esc(r.Title)+'</strong><span class="muted" style="font-size:.92rem">'+esc(r.Body)+'</span>'+(r.SearchQuery?'<a href="'+searchUrl(r.SearchQuery)+'" target="_blank" rel="noopener">Search "'+esc(r.SearchQuery)+'" ↗</a>':'')+'</li>'; }).join('')+'</ul></section>';
  if (answered.length || st.reviews.length>1) out += '<details class="panel card"><summary>History · '+answered.length+' response'+(answered.length===1?'':'s')+', '+st.reviews.length+' review'+(st.reviews.length===1?'':'s')+'</summary><ul class="list" style="margin-top:12px">'+
    answered.map(function(r){ return '<li><span class="row"><span class="layer-tag '+r.Layer+'">'+r.Layer+'</span><span class="chip '+(r.Status==='Accepted'?'approved':'gap')+'">'+esc(r.Status)+(r.UserNote==='Adapted'?' · adapted':'')+'</span><span class="muted" style="font-size:.82rem">'+fmtDate(r.RespondedAt)+'</span></span><span>'+esc(r.Title)+'</span>'+(r.UserNote&&r.UserNote!=='Adapted'?'<span class="muted" style="font-size:.9rem">Your reason: '+esc(r.UserNote)+'</span>':'')+'</li>'; }).join('')+
    st.reviews.slice().reverse().map(function(v){ return '<li><span class="mono muted">Review · '+fmtDate(v.CreatedAt)+'</span><span>'+esc(v.Traced)+' of '+esc(v.Total)+' traced</span></li>'; }).join('')+'</ul></details>';
  return out;
}
function recCard(r){

  else if (r.ActionType==='journal') a = 'Sit with it in your journal.';
  else if (r.ActionType==='learn') a = 'Add to your learning plan'+(/⟨Skill⟩/.test(r.ActionText)?' (skill)':'')+': '+esc(act);
  else if (r.ActionType==='community') a = r.SearchQuery ? 'Look for: <a href="'+searchUrl(r.SearchQuery)+'" target="_blank" rel="noopener">'+esc(r.SearchQuery)+' ↗</a>' : '';
  return '<article class="panel gcard '+r.Layer+'"><span class="row"><span class="chip L-'+r.Layer+'">'+esc(r.Kind)+'</span>'+(r.TracesTo?'<span class="muted" style="font-size:.85rem">Serves your '+esc(r.TracesTo)+'</span>':'')+'</span>'+
    '<h3>'+esc(r.Title)+'</h3><div>'+md(r.Body)+'</div>'+(a?'<div class="act">'+a+'</div>':'')+
    '<div class="row"><button class="btn small primary" data-act="rec" data-id="'+esc(r.RecID)+'">'+(r.ActionType==='journal'?'Sit with it':r.ActionType==='community'?'Save it':'Accept')+'</button>'+
    (r.ActionType==='revise'||r.ActionType==='learn'?'<button class="btn small" data-act="recAdapt" data-id="'+esc(r.RecID)+'">Adapt</button>':'')+
    '<button class="btn small ghost" data-act="recDecline" data-id="'+esc(r.RecID)+'">Decline</button></div></article>';
}
function findRec(id){ return S.state.recs.filter(function(r){ return r.RecID===id; })[0]; }
function respond(id, status, extra){
  var rec = findRec(id);
  api('respondRec', Object.assign({ recId:id, status:status }, extra||{})).then(function(res){
    setState(res.state); closeDialog();
    var nx = res.next || {};
    if (status==='Declined'){ render(); toast('Declined. Your reason helps your coach.'); return; }
    if (status==='Accepted') breathe();
    if (nx.open){ toast('Accepted. Let\'s work it into '+nx.open.slice(8)+'.'); openCtx(nx.open); return; }
    if (nx.journal){ S.inputsTab='journal'; S.journalPrompt=nx.journal; go('inputs'); return; }
    if (nx.growth){ render(); toast('Added to your learning plan under Inputs.'); return; }
    render(); toast(rec && rec.Kind==='community' ? 'Saved to your communities.' : 'Accepted.');
  }).catch(fail);
}
function runReview(){
  if (S.reviewing) return;

    .catch(function(e){ S.reviewErr = e.message || String(e); })
    .then(function(){ S.reviewing=false; if(S.view==='iterate') render(); if(!S.reviewErr) breathe(); });
}

/* ---------- editor inputs ---------- */
document.addEventListener('input', function(ev){

  var V = S.edit.values, k = t.dataset.f;
  if (t.dataset.inp==='score'){

  } else if (t.dataset.inp==='pct'){

});

/* ---------- clicks & submits ---------- */
function phaseAClick(act, t){
  var E = S.edit, V = E && E.values, k = t.dataset.f;
  switch (act){
    case 'tab': S.inputsTab = t.dataset.tab; render(); return true;
    case 'editTest': openEditor(t.dataset.test); return true;
    case 'rk-add': { var f=fieldDef(k), a=V[k]=V[k]||[], v=t.dataset.v, i=a.indexOf(v); if(i>=0) a.splice(i,1); else if(a.length<f.max) a.push(v); renderEditor(); return true; }
    case 'rk-up': case 'rk-down': { var a2=V[k], i2=Number(t.dataset.i), j=act==='rk-up'?i2-1:i2+1; if(j<0||j>=a2.length) return true; var tmp=a2[i2]; a2[i2]=a2[j]; a2[j]=tmp; renderEditor(); return true; }
    case 'rk-rm': V[k].splice(Number(t.dataset.i),1); renderEditor(); return true;
    case 'sel': { var f2=fieldDef(k); V[k] = (V[k]===t.dataset.v && (f2.optional||f2.type==='wing')) ? '' : t.dataset.v;
      if (k==='type') V.wing=''; renderEditor(); return true; }
    case 'pair': { V[k]=V[k]||[]; var ix=Number(t.dataset.i); V[k][ix]=Object.assign({}, V[k][ix]||{}, { pick:t.dataset.v }); renderEditor(); return true; }
    case 'bk': { V[k]=V[k]||{}; V[k][t.dataset.item] = V[k][t.dataset.item]===t.dataset.v ? '' : t.dataset.v; renderEditor(); return true; }
    case 'edSave': {
      E.takenOn = $('#ed-date').value; E.notes = $('#ed-notes').value;
      var err = $('#ed-err'); err.hidden = true;
      api('saveAssessment',{ test:E.key, values:V, takenOn:E.takenOn, notes:E.notes }).then(function(st){ setState(st); closeDialog(); render(); breathe(); toast(LID.testDef(E.key).name+' saved. Your coach will draw on it.'); })
        .catch(function(e){ err.textContent = e.message; err.hidden = false; });
      return true;
    }
    case 'edClear':
      if (!t.dataset.armed){ t.dataset.armed='1'; t.textContent='Click again to clear'; return true; }
      api('clearAssessment',{ test:E.key }).then(function(st){ setState(st); closeDialog(); render(); toast('Results cleared.'); }).catch(fail); return true;
    case 'nextPrompt': { var j2=$('#jr-entry'); if(j2) S.jrDraft=j2.value; var pool=promptPool(); S.promptIdx=(S.promptIdx+1)%pool.length; S.journalPrompt=pool[S.promptIdx]; render(); return true; }
    case 'clearPrompt': { var j3=$('#jr-entry'); if(j3) S.jrDraft=j3.value; S.journalPrompt=''; render(); return true; }
    case 'jrShare': api('updateJournal',{ entryId:t.dataset.id, coachCanRead:t.dataset.v==='1' }).then(setState).then(function(){ keepJournalDraft(); render(); toast(t.dataset.v==='1'?'Shared with your coach.':'Now private.'); }).catch(fail); return true;
    case 'jrDel': openDialog('<h2>Delete this entry?</h2><p>The text is erased from your design record and can\'t be recovered.</p><div class="row"><button class="btn primary" data-act="jrDelYes" data-id="'+esc(t.dataset.id)+'">Delete</button><button class="btn ghost" data-act="cancel">Keep it</button></div>'); return true;
    case 'jrDelYes': api('updateJournal',{ entryId:t.dataset.id, erase:true }).then(setState).then(function(){ closeDialog(); keepJournalDraft(); render(); toast('Entry deleted.'); }).catch(fail); return true;
    case 'gkind': S.growthKind=t.dataset.v; Array.prototype.forEach.call(t.parentNode.children, function(b){ b.setAttribute('aria-pressed', String(b===t)); }); return true;
    case 'grDone': api('updateGrowth',{ itemId:t.dataset.id, status:'Acquired' }).then(setState).then(function(){ render(); breathe(); toast('Acquired. Nicely done.'); }).catch(fail); return true;
    case 'grRm': api('updateGrowth',{ itemId:t.dataset.id, erase:true }).then(setState).then(render).catch(fail); return true;
    case 'runReview': runReview(); return true;
    case 'rec': respond(t.dataset.id, 'Accepted'); return true;
    case 'recAdapt': { var r=findRec(t.dataset.id);
      openDialog('<span class="eyebrow">Adapt · '+esc(r.Layer)+'</span><h2>'+esc(r.Title)+'</h2><p class="muted">Put it in your own words. What you accept becomes a new input to your design.</p>'+
        '<div class="field"><label for="rec-text">'+(r.ActionType==='learn'?'What you will learn':'What you will work into '+esc(r.ActionElement))+'</label><textarea id="rec-text" rows="4">'+esc(cleanAct(r.ActionText))+'</textarea></div>'+
        '<div class="row"><button class="btn primary" data-act="recAdaptSave" data-id="'+esc(r.RecID)+'">Accept my version</button><button class="btn ghost" data-act="cancel">Cancel</button></div>'); return true; }
    case 'recAdaptSave': { var r2=findRec(t.dataset.id), txt=($('#rec-text').value||'').trim(); if(!txt){ toast('Write your version first.'); return true; }
      if (/⟨Skill⟩/.test(r2.ActionText)) txt += ' ⟨Skill⟩'; respond(r2.RecID,'Accepted',{ actionText:txt }); return true; }
    case 'recDecline': { var r3=findRec(t.dataset.id);
      openDialog('<span class="eyebrow">Decline</span><h2>'+esc(r3.Title)+'</h2><div class="field"><label for="rec-note">Why not? <span class="hint">Optional. It helps your coach understand you.</span></label><textarea id="rec-note" rows="3"></textarea></div>'+
        '<div class="row"><button class="btn primary" data-act="recDeclineSave" data-id="'+esc(r3.RecID)+'">Decline</button><button class="btn ghost" data-act="cancel">Cancel</button></div>'); return true; }
    case 'recDeclineSave': respond(t.dataset.id,'Declined',{ note:($('#rec-note').value||'').trim() }); return true;
    case 'nudge': {
      var to=t.dataset.to;
      if (to==='journal'||to==='tests'||to==='growth'){ S.inputsTab=to; go('inputs'); }
      else if (to==='journey') { var c=$('.side .list'); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); }
      else go(to);
      return true;
    }
  }
  return false;
}

/* ---------- boot ---------- */
function bootHosted(){
  Hosted.session().then(function(ses){
    if (!ses){ S.view='signin'; render(); return; }
    S.userId = ses.user.id; S.email = ses.user.email || '';
    return api('getState').then(function(st){ setState(st); return api('startSession'); })
      .then(function(s){ S.sessionId=s.SessionID; go('journey'); })
      .catch(function(e){
        if (e && e.code === 'signed_out') return;
        if (/No design found/.test(e && e.message)){ S.view='welcome'; render(); return; }
        S.bootErr = e.message; S.view='setup'; render();
      });
  });
}
var bootedFor = null;
function boot(){
  if (HOST_PROBLEM){ S.view='setup'; render(); return; }
  if (HOSTED){
    Hosted.onChange(function(ev, ses){
      var id = ses && ses.user ? ses.user.id : null;
      if (ev === 'SIGNED_IN' && id && id !== bootedFor){ bootedFor = id; bootHosted(); }
      if (ev === 'SIGNED_OUT' && S.view !== 'signin'){ S.state=null; S.userId=null; S.view='signin'; render(); }
    });
    Hosted.session().then(function(ses){
      var id = ses && ses.user ? ses.user.id : null;
      if (id && id === bootedFor) return;
      if (id) bootedFor = id;
      bootHosted();
    });
    return;
  }
  if (!S.userId){ S.view='welcome'; render(); return; }
  api('getState').then(function(st){ setState(st); return api('startSession'); })
    .then(function(s){ S.sessionId=s.SessionID; go('journey'); })
    .catch(function(){ store.del('lid.userId'); S.userId=null; S.view='welcome'; render(); });
}
boot();
})();
</script>
